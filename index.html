<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقشهٔ کار پروژه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D2438;
    --bg-card:#123350;
    --bg-card-2:#163b5c;
    --line:#3E6E8E;
    --line-soft:rgba(62,110,142,.35);
    --text:#EAF1F5;
    --text-dim:#93AFC2;
    --amber:#E8A33D;
    --amber-dim:rgba(232,163,61,.14);
    --olive:#8FA05F;
    --danger:#C1554B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(62,110,142,.18), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    padding:32px 18px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.14em;color:var(--amber);
    text-transform:uppercase;margin-bottom:8px;
  }
  h1{
    font-weight:800;font-size:28px;margin:0 0 6px;letter-spacing:-.01em;
  }
  .sub{color:var(--text-dim);font-size:14px;margin:0;}

  .new-project{
    display:flex;gap:8px;margin-top:20px;
  }
  .new-project input{flex:1;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;
    border:1px dashed var(--line);background:transparent;color:var(--text);
    border-radius:8px;padding:10px 16px;cursor:pointer;
    transition:.15s ease;
  }
  .btn:hover{background:var(--line-soft);}
  .btn.primary{
    background:var(--amber);border-color:var(--amber);color:#1a1206;
  }
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn.icon{
    width:28px;height:28px;padding:0;display:inline-flex;
    align-items:center;justify-content:center;border-radius:6px;
  }
  input[type=text]{
    font-family:inherit;font-size:14px;color:var(--text);
    background:var(--bg-card);border:1px solid var(--line-soft);
    border-radius:8px;padding:9px 12px;outline:none;
  }
  input[type=text]:focus{border-color:var(--amber);}

  .projects{display:flex;flex-direction:column;gap:16px;}

  .project-card{
    background:var(--bg-card);
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:18px 20px 20px;
    position:relative;
  }
  .project-card::before{
    content:'';position:absolute;inset:0;border-radius:14px;
    background-image:
      repeating-linear-gradient(0deg, var(--line-soft) 0 1px, transparent 1px 24px);
    opacity:.15;pointer-events:none;
  }
  .project-head{
    margin-bottom:6px;
  }
  .project-title-row{display:contents;}
  .project-title{
    display:inline-block;font-weight:700;font-size:18px;padding:2px 4px;border-radius:4px;
    white-space:nowrap;
  }
  .project-title[contenteditable]:focus{outline:none;border-bottom:1px dashed var(--amber);}
  .project-actions{display:flex;gap:6px;flex-shrink:0;}

  .measure{
    margin:12px 0 16px;position:relative;height:14px;
  }
  .measure .track{
    position:absolute;inset-inline:0;top:6px;height:2px;background:var(--line-soft);
  }
  .measure .fill{
    position:absolute;top:6px;right:0;height:2px;background:var(--amber);
    transition:width .3s ease;
  }
  .measure .ticks{
    position:absolute;inset:0;display:flex;justify-content:space-between;
  }
  .measure .ticks span{width:1px;height:8px;background:var(--line-soft);margin-top:1px;}
  .measure-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    display:flex;justify-content:space-between;margin-top:2px;
  }
  .measure-label b{color:var(--amber);font-weight:600;}

  .tree{margin-top:6px;}
  .node{position:relative;}
  .node-row{
    padding:6px 0;
    position:relative;
  }
  .children{
    border-right:1px dashed var(--line-soft);
    margin-right:11px;
    padding-right:20px;
  }
  .children .node::before{
    content:'';position:absolute;right:-20px;top:19px;width:19px;height:0;
    border-top:1px dashed var(--line-soft);
  }

  .chevron{
    width:16px;height:16px;flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);transition:transform .15s ease;
    user-select:none;
  }
  .chevron.collapsed{transform:rotate(-90deg);}
  .chevron.spacer{cursor:default;}

  .stamp{
    width:19px;height:19px;flex-shrink:0;border-radius:5px;
    border:1.6px dashed var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
    position:relative;
  }
  .stamp svg{opacity:0;transform:scale(.5);transition:.15s ease;}
  .stamp.checked{
    background:var(--amber);border-color:var(--amber);border-style:solid;
    transform:rotate(-4deg);
  }
  .stamp.checked svg{opacity:1;transform:scale(1) rotate(4deg);}
  .stamp.indeterminate{border-style:solid;border-color:var(--amber);}
  .stamp.indeterminate::after{
    content:'';width:9px;height:2px;background:var(--amber);border-radius:1px;
  }

  .row-inner{
    display:flex;align-items:center;gap:8px;
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;touch-action:pan-x;
    scrollbar-width:thin;padding-bottom:2px;
  }
  .row-inner::-webkit-scrollbar{height:5px;}
  .row-inner::-webkit-scrollbar-thumb{background:var(--line-soft);border-radius:3px;}
  .row-inner > *{flex-shrink:0;}
  .text-scroll{display:contents;}
  .node-text{
    display:inline-block;font-size:14.5px;padding:2px 4px;border-radius:4px;
    cursor:text;white-space:nowrap;
  }
  .node-text:focus{outline:none;background:var(--line-soft);}
  .node.done > .node-row .node-text{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--line);}

  .drag-handle{
    width:20px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:grab;touch-action:none;opacity:.55;-webkit-user-select:none;user-select:none;
  }
  .drag-handle:active{cursor:grabbing;opacity:1;}
  .node.dragging, .project-card.dragging{opacity:.35;}
  .node.drag-over-top, .project-card.drag-over-top{box-shadow: inset 0 2px 0 var(--amber);}
  .node.drag-over-bottom, .project-card.drag-over-bottom{box-shadow: inset 0 -2px 0 var(--amber);}

  .cost-input{
    width:62px;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:12px;
    background:var(--bg-card-2);border:1px solid var(--line-soft);border-radius:6px;
    padding:4px 5px;color:var(--amber);text-align:center;outline:none;
    -moz-appearance:textfield;
  }
  .cost-input::-webkit-outer-spin-button, .cost-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .cost-input::placeholder{color:var(--text-dim);opacity:.55;}
  .cost-input:focus{border-color:var(--amber);}
  .cost-total{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);
    display:flex;justify-content:space-between;margin-top:6px;
  }
  .cost-total b{color:var(--amber);font-weight:600;}

  .node-actions{display:flex;gap:2px;flex-shrink:0;}
  .ghost-btn{
    width:26px;height:26px;border-radius:6px;border:none;background:transparent;
    color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
    opacity:.75;
  }
  .ghost-btn:hover, .ghost-btn:active{background:var(--line-soft);color:var(--text);opacity:1;}
  .ghost-btn.danger:hover, .ghost-btn.danger:active{background:rgba(193,85,75,.2);color:var(--danger);}
  .star-btn{
    width:22px;height:22px;flex-shrink:0;border:none;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--line);opacity:.7;
  }
  .star-btn:hover{opacity:1;}
  .star-btn.starred{color:var(--amber);opacity:1;}

  .star-panel{
    background:var(--bg-card);border:1px solid var(--line-soft);border-radius:14px;
    padding:16px 18px 18px;margin-bottom:24px;
  }
  .star-panel h2{
    font-size:14px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:6px;
  }
  .star-panel h2 .star-btn{opacity:1;color:var(--amber);cursor:default;width:16px;height:16px;}
  .star-empty{color:var(--text-dim);font-size:13px;padding:6px 2px;}
  .star-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.star-table{width:100%;border-collapse:collapse;min-width:max-content;}
  table.star-table td{
    padding:8px 10px;border-top:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle;
    white-space:nowrap;
  }
  table.star-table td.col-title{max-width:46vw;overflow-x:auto;overflow-y:hidden;display:inline-block;vertical-align:middle;scrollbar-width:thin;}
  table.star-table tr:first-child td{border-top:none;}
  table.star-table td.col-check{width:26px;}
  table.star-table td.col-star{width:26px;text-align:left;}
  table.star-table td.col-path{color:var(--text-dim);font-size:12px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  table.star-table tr.done td.col-title{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--line);}

  .add-row{
    display:flex;gap:6px;align-items:center;padding:6px 0 6px 0;
    margin-right:0;
  }
  .add-row input{flex:1;padding:6px 10px;font-size:13px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--text-dim);
    border:1px dashed var(--line-soft);border-radius:14px;
  }
  .empty .big{font-size:32px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--bg-card-2);border:1px solid var(--line);
    padding:10px 18px;border-radius:8px;font-size:13px;color:var(--text-dim);
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">نقشهٔ کار // ساختار درختی</div>
    <h1>پیگیری پروژه‌ها</h1>
    <p class="sub">هر تعداد زیرمجموعه که بخواهید اضافه کنید، با کشیدن دستگیرهٔ کنار هر مورد ترتیبشان را عوض کنید و برآورد هزینهٔ هرکدام را ثبت کنید.</p>
    <div class="new-project">
      <input type="text" id="newProjectInput" placeholder="نام پروژهٔ جدید… مثلاً «پروژه زیتون»">
      <button class="btn primary" id="addProjectBtn">+ پروژه جدید</button>
    </div>
  </header>

  <div class="star-panel" id="starPanel">
    <h2><span class="star-btn starred">★</span> کارهای ستاره‌دار</h2>
    <div id="starPanelBody"></div>
  </div>

  <div class="projects" id="projects"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="big">🗂️</div>
    هنوز پروژه‌ای ثبت نشده. یکی از بالا اضافه کنید.
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'project-tree-data-v1';
let data = null; // { projects: [ node, ... ] }
let saveTimer = null;

function uid(){ return 'n' + Math.random().toString(36).slice(2,10); }

function makeNode(text){
  return { id: uid(), text, checked:false, starred:false, cost:null, expanded:true, children:[] };
}

function seedData(){
  const zeitoun = makeNode('پروژه زیتون');
  const bargh = makeNode('برق کشی');
  bargh.children.push(makeNode('هماهنگی با صابر'));
  const loole = makeNode('لوله کشی تاسیسات');
  loole.children.push(makeNode('هماهنگی با فیروز پور'));
  zeitoun.children.push(bargh, loole);

  const ghamshe = makeNode('پروژه قمشه');
  const kandan = makeNode('کندن کف محوطه');
  kandan.children.push(makeNode('هماهنگ کردن بیل مکانیکی'));
  ghamshe.children.push(kandan);

  return { projects: [zeitoun, ghamshe] };
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      data = JSON.parse(raw);
      return;
    }
  }catch(e){ /* corrupted or unavailable -> fall through to seed */ }
  data = seedData();
  persist();
}

function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){
      showToast('ذخیره‌سازی با خطا مواجه شد');
      console.error('storage error', e);
    }
  }, 150);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function findNode(list, id){
  for(const n of list){
    if(n.id === id) return n;
    const found = findNode(n.children, id);
    if(found) return found;
  }
  return null;
}
function findParentList(list, id, parentList=null){
  for(const n of list){
    if(n.id === id) return parentList || list;
    const found = findParentList(n.children, id, n.children);
    if(found) return found;
  }
  return null;
}

function setCheckedCascade(node, value){
  node.checked = value;
  node.children.forEach(c => setCheckedCascade(c, value));
}

function countStats(node){
  // count all nodes below (not including itself) checked/total, plus itself
  let total = 1, checked = node.checked ? 1 : 0;
  for(const c of node.children){
    const s = countStats(c);
    total += s.total; checked += s.checked;
  }
  return { total, checked };
}

function recomputeAncestors(list, targetId, rootProjectsRef){
  // walk whole tree, for every node with children, derive its own checked/indeterminate state
  function walk(n){
    n.children.forEach(walk);
    if(n.children.length){
      const allChecked = n.children.every(c => c.checked && !c.indeterminate);
      const noneChecked = n.children.every(c => !c.checked && !c.indeterminate);
      if(allChecked){ n.checked = true; n.indeterminate = false; }
      else if(noneChecked){ n.checked = false; n.indeterminate = false; }
      else { n.checked = false; n.indeterminate = true; }
    } else {
      n.indeterminate = false;
    }
  }
  rootProjectsRef.forEach(walk);
}

function toggleNode(id){
  const node = findNode(data.projects, id);
  if(!node) return;
  const newVal = !(node.checked && !node.indeterminate) ? true : false;
  setCheckedCascade(node, newVal);
  recomputeAncestors(data.projects, id, data.projects);
  persist();
  render();
}

function addChild(parentList, text){
  if(!text.trim()) return;
  parentList.push(makeNode(text.trim()));
  persist();
  render();
}

function deleteNode(id){
  const parentList = findParentList(data.projects, id);
  if(!parentList) return;
  const idx = parentList.findIndex(n=>n.id===id);
  if(idx > -1){
    parentList.splice(idx,1);
    persist();
    render();
  }
}

function toggleExpand(id){
  const node = findNode(data.projects, id);
  if(!node) return;
  node.expanded = !node.expanded;
  persist();
  render();
}

function updateText(id, text){
  const node = findNode(data.projects, id);
  if(!node) return;
  node.text = text;
  persist();
}

function toggleStar(id){
  const node = findNode(data.projects, id);
  if(!node) return;
  node.starred = !node.starred;
  persist();
  render();
}

function costSum(node){
  let total = parseFloat(node.cost) || 0;
  node.children.forEach(c => total += costSum(c));
  return total;
}

function formatCost(n){
  return Math.round(n).toLocaleString('en-US');
}

function updateCost(id, value, projectId){
  const node = findNode(data.projects, id);
  if(!node) return;
  node.cost = value === '' ? null : parseFloat(value);
  persist();
  const labelEl = document.querySelector(`.project-card[data-id="${projectId}"] .cost-total-value`);
  if(labelEl){
    const project = findNode(data.projects, projectId);
    labelEl.textContent = formatCost(costSum(project));
  }
}

function collectStarred(){
  const out = [];
  function walk(node, ancestors){
    if(node.starred){
      out.push({
        id: node.id,
        text: node.text,
        checked: node.checked && !node.indeterminate,
        path: ancestors.length ? ancestors.join(' › ') : node.text
      });
    }
    node.children.forEach(c => walk(c, [...ancestors, node.text]));
  }
  data.projects.forEach(p => walk(p, []));
  return out;
}

// ---------- drag & drop reorder ----------

let dragState = null;

function makeDragHandle(node, siblingList, wrapperEl){
  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.innerHTML = svgGrip();
  handle.addEventListener('pointerdown', (e)=> startDrag(e, node.id, siblingList, wrapperEl));
  return handle;
}

function startDrag(e, id, list, wrapperEl){
  e.preventDefault();
  const containerEl = wrapperEl.parentElement;
  if(!containerEl) return;
  const siblingEls = Array.from(containerEl.children)
    .filter(el => el.classList.contains('node') || el.classList.contains('project-card'));
  dragState = { id, list, wrapperEl, siblingEls, hoverEl:null, hoverPos:null };
  wrapperEl.classList.add('dragging');
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd, { once:true });
}

function onDragMove(e){
  if(!dragState) return;
  const y = e.clientY;
  const others = dragState.siblingEls.filter(el => el !== dragState.wrapperEl);
  let target = null, pos = null;
  for(const el of others){
    const rect = el.getBoundingClientRect();
    const mid = rect.top + rect.height/2;
    if(y < mid){ target = el; pos = 'before'; break; }
  }
  if(!target && others.length){ target = others[others.length-1]; pos = 'after'; }
  clearDragIndicators();
  if(target){
    target.classList.add(pos==='before' ? 'drag-over-top' : 'drag-over-bottom');
    dragState.hoverEl = target;
    dragState.hoverPos = pos;
  }
}

function clearDragIndicators(){
  document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el=>{
    el.classList.remove('drag-over-top','drag-over-bottom');
  });
}

function onDragEnd(){
  if(!dragState) return;
  document.removeEventListener('pointermove', onDragMove);
  clearDragIndicators();
  dragState.wrapperEl.classList.remove('dragging');

  const { list, id, hoverEl, hoverPos } = dragState;
  dragState = null;
  if(!hoverEl) return;

  const targetId = hoverEl.dataset.id;
  const fromIdx = list.findIndex(n=>n.id===id);
  if(fromIdx===-1) return;
  const [moved] = list.splice(fromIdx,1);
  let toIdx = list.findIndex(n=>n.id===targetId);
  if(toIdx===-1){ list.splice(fromIdx,0,moved); return; }
  if(hoverPos==='after') toIdx += 1;
  list.splice(toIdx,0,moved);
  persist();
  render();
}

// ---------- rendering ----------

function svgCheck(){
  return `<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="#1a1206" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function svgChevron(){
  return `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function svgPlus(){
  return `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1V12M1 6.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
}
function svgGrip(){
  return `<svg width="11" height="16" viewBox="0 0 11 16" fill="currentColor">
    <circle cx="3" cy="3" r="1.3"/><circle cx="8" cy="3" r="1.3"/>
    <circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/>
    <circle cx="3" cy="13" r="1.3"/><circle cx="8" cy="13" r="1.3"/>
  </svg>`;
}
function svgStar(filled){
  return `<svg width="14" height="14" viewBox="0 0 16 16" fill="${filled ? 'currentColor' : 'none'}"><path d="M8 1.5l1.9 4.1 4.4.5-3.3 3 .9 4.4L8 11.3l-3.9 2.2.9-4.4-3.3-3 4.4-.5L8 1.5z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>`;
}
function svgTrash(){
  return `<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 3.5H12M5 3.5V2.2C5 1.8 5.3 1.5 5.7 1.5H8.3C8.7 1.5 9 1.8 9 2.2V3.5M5.7 6.3V10M8.3 6.3V10M3.3 3.5L3.9 11.5C3.95 12.05 4.4 12.5 5 12.5H9C9.6 12.5 10.05 12.05 10.1 11.5L10.7 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function renderNode(node, depth, siblingList, projectId){
  const el = document.createElement('div');
  el.className = 'node' + (node.checked && !node.indeterminate ? ' done' : '');

  const row = document.createElement('div');
  row.className = 'node-row';
  const rowInner = document.createElement('div');
  rowInner.className = 'row-inner';
  row.appendChild(rowInner);

  rowInner.appendChild(makeDragHandle(node, siblingList, el));

  const hasChildren = node.children.length > 0;
  const chev = document.createElement('span');
  chev.className = 'chevron' + (hasChildren ? (node.expanded ? '' : ' collapsed') : ' spacer');
  chev.innerHTML = hasChildren ? svgChevron() : '';
  if(hasChildren) chev.onclick = ()=>toggleExpand(node.id);
  rowInner.appendChild(chev);

  const stamp = document.createElement('span');
  stamp.className = 'stamp' + (node.checked && !node.indeterminate ? ' checked' : '') + (node.indeterminate ? ' indeterminate' : '');
  stamp.innerHTML = (node.checked && !node.indeterminate) ? svgCheck() : '';
  stamp.onclick = ()=>toggleNode(node.id);
  rowInner.appendChild(stamp);

  const star = document.createElement('button');
  star.className = 'star-btn' + (node.starred ? ' starred' : '');
  star.title = node.starred ? 'حذف ستاره' : 'ستاره‌دار کردن';
  star.innerHTML = svgStar(node.starred);
  star.onclick = ()=> toggleStar(node.id);
  rowInner.appendChild(star);

  const costInput = document.createElement('input');
  costInput.type = 'number';
  costInput.className = 'cost-input';
  costInput.placeholder = 'هزینه';
  costInput.inputMode = 'decimal';
  costInput.value = (node.cost === null || node.cost === undefined) ? '' : node.cost;
  costInput.oninput = ()=> updateCost(node.id, costInput.value, projectId);
  rowInner.appendChild(costInput);

  const text = document.createElement('span');
  text.className = 'node-text';
  text.contentEditable = 'true';
  text.textContent = node.text;
  text.spellcheck = false;
  text.onblur = ()=> updateText(node.id, text.textContent.trim() || node.text);
  text.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); text.blur(); } };
  rowInner.appendChild(text);

  const actions = document.createElement('span');
  actions.className = 'node-actions';
  const addBtn = document.createElement('button');
  addBtn.className = 'ghost-btn';
  addBtn.title = 'افزودن زیرمجموعه';
  addBtn.innerHTML = svgPlus();
  addBtn.onclick = ()=> showAddRow(el, node.children, node);
  const delBtn = document.createElement('button');
  delBtn.className = 'ghost-btn danger';
  delBtn.title = 'حذف';
  delBtn.innerHTML = svgTrash();
  delBtn.onclick = ()=>{
    if(confirm(`«${node.text}» و همهٔ زیرمجموعه‌هایش حذف شود؟`)) deleteNode(node.id);
  };
  actions.appendChild(addBtn);
  actions.appendChild(delBtn);
  rowInner.appendChild(actions);

  el.appendChild(row);

  if(hasChildren && node.expanded){
    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'children';
    node.children.forEach(c => childrenWrap.appendChild(renderNode(c, depth+1, node.children, projectId)));
    el.appendChild(childrenWrap);
  } else if(hasChildren && !node.expanded){
    // keep container for future adds, just hidden
  } else {
    // no children yet — still allow an inline add container to appear when requested
  }

  el.dataset.id = node.id;
  return el;
}

function showAddRow(nodeEl, childList, node){
  let childrenWrap = nodeEl.querySelector(':scope > .children');
  if(!childrenWrap){
    childrenWrap = document.createElement('div');
    childrenWrap.className = 'children';
    nodeEl.appendChild(childrenWrap);
    node.expanded = true;
  }
  if(childrenWrap.querySelector(':scope > .add-row-inline')) {
    childrenWrap.querySelector('input').focus();
    return;
  }
  const row = document.createElement('div');
  row.className = 'add-row add-row-inline';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'عنوان زیرمجموعه…';
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn small primary';
  confirmBtn.textContent = 'افزودن';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn small';
  cancelBtn.textContent = 'انصراف';
  const commit = ()=>{
    if(input.value.trim()){
      addChild(childList, input.value);
    } else {
      render();
    }
  };
  confirmBtn.onclick = commit;
  input.onkeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    if(e.key==='Escape'){ render(); }
  };
  cancelBtn.onclick = ()=> render();
  row.appendChild(input);
  row.appendChild(confirmBtn);
  row.appendChild(cancelBtn);
  childrenWrap.appendChild(row);
  input.focus();
}

function renderProject(project){
  const card = document.createElement('div');
  card.className = 'project-card';

  const head = document.createElement('div');
  head.className = 'project-head';

  const titleRow = document.createElement('div');
  titleRow.className = 'project-title-row';
  titleRow.appendChild(makeDragHandle(project, data.projects, card));
  const chev = document.createElement('span');
  chev.className = 'chevron' + (project.expanded ? '' : ' collapsed');
  chev.innerHTML = svgChevron();
  chev.onclick = ()=>toggleExpand(project.id);
  titleRow.appendChild(chev);
  const star = document.createElement('button');
  star.className = 'star-btn' + (project.starred ? ' starred' : '');
  star.title = project.starred ? 'حذف ستاره' : 'ستاره‌دار کردن';
  star.innerHTML = svgStar(project.starred);
  star.onclick = ()=> toggleStar(project.id);
  titleRow.appendChild(star);
  const costInput = document.createElement('input');
  costInput.type = 'number';
  costInput.className = 'cost-input';
  costInput.placeholder = 'هزینه';
  costInput.inputMode = 'decimal';
  costInput.value = (project.cost === null || project.cost === undefined) ? '' : project.cost;
  costInput.oninput = ()=> updateCost(project.id, costInput.value, project.id);
  titleRow.appendChild(costInput);
  const titleWrap = document.createElement('span');
  titleWrap.className = 'text-scroll';
  const title = document.createElement('span');
  title.className = 'project-title';
  title.contentEditable = 'true';
  title.textContent = project.text;
  title.onblur = ()=> updateText(project.id, title.textContent.trim() || project.text);
  title.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); title.blur(); } };
  titleWrap.appendChild(title);
  titleRow.appendChild(titleWrap);
  head.appendChild(titleRow);

  const actions = document.createElement('div');
  actions.className = 'project-actions';
  const addBtn = document.createElement('button');
  addBtn.className = 'ghost-btn';
  addBtn.title = 'افزودن زیرمجموعه';
  addBtn.innerHTML = svgPlus();
  addBtn.onclick = ()=> showAddRow(card, project.children, project);
  const delBtn = document.createElement('button');
  delBtn.className = 'ghost-btn danger';
  delBtn.title = 'حذف پروژه';
  delBtn.innerHTML = svgTrash();
  delBtn.onclick = ()=>{
    if(confirm(`پروژهٔ «${project.text}» به‌طور کامل حذف شود؟`)) deleteNode(project.id);
  };
  actions.appendChild(addBtn);
  actions.appendChild(delBtn);
  head.appendChild(actions);

  card.appendChild(head);

  const stats = countStats(project);
  const otherTotal = stats.total - 1, otherChecked = stats.checked - (project.checked?1:0);
  const pct = otherTotal > 0 ? Math.round((otherChecked/otherTotal)*100) : (project.checked?100:0);

  const measure = document.createElement('div');
  measure.className = 'measure';
  measure.innerHTML = `
    <div class="track"></div>
    <div class="fill" style="width:${pct}%"></div>
    <div class="ticks">${Array.from({length:11}).map(()=>'<span></span>').join('')}</div>
  `;
  card.appendChild(measure);
  const label = document.createElement('div');
  label.className = 'measure-label';
  label.innerHTML = `<span>${otherChecked} از ${otherTotal} مورد انجام‌شده</span><b>${pct}٪</b>`;
  card.appendChild(label);

  const costTotal = document.createElement('div');
  costTotal.className = 'cost-total';
  costTotal.innerHTML = `<span>برآورد هزینهٔ کل</span><b class="cost-total-value">${formatCost(costSum(project))}</b>`;
  card.appendChild(costTotal);

  if(project.expanded){
    const tree = document.createElement('div');
    tree.className = 'tree';
    project.children.forEach(c => tree.appendChild(renderNode(c, 1, project.children, project.id)));
    card.appendChild(tree);

    const addRootRow = document.createElement('div');
    addRootRow.style.marginTop = '8px';
    const addChildBtn = document.createElement('button');
    addChildBtn.className = 'btn small';
    addChildBtn.textContent = '+ افزودن مورد';
    addChildBtn.onclick = ()=> showAddRow(card, project.children, project);
    addRootRow.appendChild(addChildBtn);
    card.appendChild(addRootRow);
  }

  card.dataset.id = project.id;
  return card;
}

function renderStarPanel(){
  const body = document.getElementById('starPanelBody');
  const items = collectStarred();
  if(!items.length){
    body.innerHTML = '<div class="star-empty">هنوز هیچ کاری ستاره‌دار نشده. کنار هر مورد روی ★ بزنید تا اینجا نمایش داده شود.</div>';
    return;
  }
  const table = document.createElement('table');
  table.className = 'star-table';
  const tbody = document.createElement('tbody');
  items.forEach(item => {
    const tr = document.createElement('tr');
    tr.className = item.checked ? 'done' : '';

    const tdCheck = document.createElement('td');
    tdCheck.className = 'col-check';
    const stamp = document.createElement('span');
    stamp.className = 'stamp' + (item.checked ? ' checked' : '');
    stamp.style.width = '18px'; stamp.style.height = '18px';
    stamp.innerHTML = item.checked ? svgCheck() : '';
    stamp.onclick = ()=> toggleNode(item.id);
    tdCheck.appendChild(stamp);

    const tdTitle = document.createElement('td');
    tdTitle.className = 'col-title';
    tdTitle.textContent = item.text;

    const tdPath = document.createElement('td');
    tdPath.className = 'col-path';
    tdPath.textContent = item.path;

    const tdStar = document.createElement('td');
    tdStar.className = 'col-star';
    const star = document.createElement('button');
    star.className = 'star-btn starred';
    star.title = 'حذف ستاره';
    star.innerHTML = svgStar(true);
    star.onclick = ()=> toggleStar(item.id);
    tdStar.appendChild(star);

    tr.appendChild(tdCheck);
    tr.appendChild(tdTitle);
    tr.appendChild(tdPath);
    tr.appendChild(tdStar);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  body.innerHTML = '';
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'star-table-scroll';
  scrollWrap.appendChild(table);
  body.appendChild(scrollWrap);
}

function render(){
  renderStarPanel();
  const container = document.getElementById('projects');
  const empty = document.getElementById('emptyState');
  container.innerHTML = '';
  if(!data.projects.length){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  data.projects.forEach(p => container.appendChild(renderProject(p)));
}

document.getElementById('addProjectBtn').onclick = ()=>{
  const input = document.getElementById('newProjectInput');
  if(input.value.trim()){
    data.projects.push(makeNode(input.value.trim()));
    input.value = '';
    persist();
    render();
  }
};
document.getElementById('newProjectInput').onkeydown = (e)=>{
  if(e.key==='Enter'){ document.getElementById('addProjectBtn').click(); }
};

(async ()=>{
  await loadData();
  render();
})();
</script>
</body>
