name: One-shot form back save-existing applicator
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-form-back-save-existing.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared branch hotfix
        shell: bash
        run: |
          git fetch origin hotfix/form-back-save-existing
          git checkout -B hotfix/form-back-save-existing origin/hotfix/form-back-save-existing
          git show HEAD:.github/workflows/apply-form-back-save-existing.yml | sed -n '/        run: |/,$p' | tail -n +2 | sed 's/^          //' > /tmp/apply-form-back.sh
          bash /tmp/apply-form-back.sh
      - name: Remove one-shot workflow from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/one-shot-form-back-save-existing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-shot form back applicator'
            git push origin HEAD:main
          fi
