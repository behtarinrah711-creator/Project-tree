name: E2E browser checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-phase7:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'migration/phase-7-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply phase 7 patch to source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --check .phase7/part00.patch
          git apply .phase7/part00.patch
          rm -rf .phase7
          rm -f .github/workflows/apply-phase7.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/e2e.yml
          git add -A
          git diff --cached --check
          git commit -m 'Apply phase 7 final source changes'
          git push origin HEAD:migration/phase-7-final

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'migration/phase-7-final'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: node --test $(find src -name '*.test.js' -print)
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
