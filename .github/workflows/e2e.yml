name: E2E browser checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install

      - name: Probe Firebase Auth public config
        run: |
          node - <<'NODE'
          const apiKey='AIzaSyBbRk4MsdHtj-gWnjbJExvQgW0sY6Z4uK8';
          const requiredDomain='behtarinrah711-creator.github.io';
          const response=await fetch(`https://identitytoolkit.googleapis.com/v1/projects?key=${apiKey}`);
          const text=await response.text();
          console.log('Firebase Auth config HTTP status:', response.status);
          if(!response.ok){ console.error(text); process.exit(1); }
          const config=JSON.parse(text);
          const domains=Array.isArray(config.authorizedDomains)?config.authorizedDomains:[];
          console.log('Authorized domains:', domains.join(', '));
          if(!domains.includes(requiredDomain)){
            console.error(`Missing Firebase authorized domain: ${requiredDomain}`);
            process.exit(2);
          }
          for(const host of ['tree-d92af.firebaseapp.com','tree-d92af.web.app']){
            const url=`https://${host}/__/auth/handler`;
            const probe=await fetch(url,{redirect:'manual'});
            console.log(`${host} auth handler HTTP status:`,probe.status);
            if(probe.status < 200 || probe.status >= 400){
              console.error(`Firebase auth handler unavailable on ${host}`);
              process.exit(3);
            }
          }
          NODE

      - name: Run unit regression tests
        run: node --test src/**/*.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Diagnose currently deployed login
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const target='https://behtarinrah711-creator.github.io/Project-tree/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:412,height:915},
            userAgent:'Mozilla/5.0 (Linux; Android 16; SM-S928B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0 Mobile Safari/537.36'
          });
          const page=await context.newPage();
          const out=(k,v)=>console.log(`AUTHDIAG [${k}] ${v}`);
          page.on('console',m=>out(`console.${m.type()}`,m.text()));
          page.on('pageerror',e=>out('pageerror',e.stack||e.message));
          page.on('requestfailed',r=>out('requestfailed',`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'unknown'}`));
          page.on('response',r=>{ if(r.status()>=400) out('http',`${r.status()} ${r.request().method()} ${r.url()}`); });
          page.on('popup',p=>{
            out('popup.open',p.url());
            p.on('framenavigated',f=>{if(f===p.mainFrame()) out('popup.url',f.url());});
            p.on('console',m=>out(`popup.console.${m.type()}`,m.text()));
            p.on('pageerror',e=>out('popup.pageerror',e.stack||e.message));
            p.on('requestfailed',r=>out('popup.requestfailed',`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'unknown'}`));
          });
          const res=await page.goto(target,{waitUntil:'domcontentloaded',timeout:45000});
          out('main.status',res?.status()??'none');
          await page.waitForTimeout(2500);
          out('firebase.apps',await page.evaluate(()=>window.firebase?.apps?.length??-1));
          out('firebase.auth',await page.evaluate(()=>{try{return !!window.firebase?.auth?.()}catch{return false}}));
          await page.locator('#hamburgerBtn').click();
          await page.waitForTimeout(250);
          out('login.visible',await page.locator('#drawerSigninBtn').isVisible());
          await page.locator('#drawerSigninBtn').click();
          await page.waitForTimeout(12000);
          out('toast',(await page.locator('#toast').textContent().catch(()=>''))?.trim()||'');
          out('final.url',page.url());
          await browser.close();
          NODE

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
