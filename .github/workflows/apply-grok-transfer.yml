name: Apply Grok transfer

on:
  push:
    branches: [rescue/auth-baseline]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rescue/auth-baseline
          fetch-depth: 0
      - name: Apply exact Grok files
        run: |
          cat .grok-transfer/part* | base64 -d > /tmp/grok4.tar.gz
          tar -xzf /tmp/grok4.tar.gz
          rm -rf .grok-transfer
          rm -f .github/workflows/apply-grok-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Grok login fix unchanged"
          git push origin HEAD:rescue/auth-baseline
