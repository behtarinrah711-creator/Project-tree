name: Apply migration phase 2.1

on:
  push:
    branches:
      - migration/phase-2-1-activity-api

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/phase-2-1-activity-api
          fetch-depth: 0
      - name: Apply reviewed phase 2.1 files
        shell: python
        run: |
          import base64, io, zipfile
          from pathlib import Path

          payload = ''''''
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as z:
              z.extractall('.')

          p = Path('src/legacy/legacyApp.js')
          s = p.read_text(encoding='utf-8')
          old_persist = '''function persist(){
            clearTimeout(saveTimer);
            saveTimer = setTimeout(()=>{
              (data.projects||[]).forEach(rememberProjectTasks);
              try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
              catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
              if(cloudMode && currentUser){'''
          new_persist = '''function persist(options){
            const writeLocal = !options || options.local !== false;
            clearTimeout(saveTimer);
            saveTimer = setTimeout(()=>{
              if(writeLocal){
                (data.projects||[]).forEach(rememberProjectTasks);
                try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
                catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
              }
              if(cloudMode && currentUser){'''
          if s.count(old_persist) != 1:
              raise SystemExit('persist patch anchor mismatch')
          s = s.replace(old_persist, new_persist, 1)

          old_activity = '''  } else if(type === 'activity'){
            const p=findProject(pid); const a=p ? findActivityTemplate(gid,p) : null;
            if(a){ a.trashed=true; a.deletedAt=Date.now(); a.deletedType='activity'; markDirty(pid); }
          }'''
          new_activity = '''  } else if(type === 'activity'){
            window.KarhaApp?.activityApi?.trash?.(pid,gid);
          }'''
          if s.count(old_activity) != 1:
              raise SystemExit('activity delete patch anchor mismatch')
          s = s.replace(old_activity, new_activity, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit applied snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain src/data/activityRepository.js src/data/activityRepository.test.js src/modules/activities src/legacy/legacyApp.js
          git rm .github/workflows/apply-phase21.yml
          git commit -m "Migrate activity writes to domain API"
          git push origin HEAD:migration/phase-2-1-activity-api
