name: Apply exact Grok ZIP hotfix

on:
  push:
    branches:
      - hotfix/grok-contract-back-guest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hotfix/grok-contract-back-guest
          fetch-depth: 0

      - name: Apply exact ZIP changes
        run: python .github/scripts/apply_exact_grok_hotfix.py

      - name: Verify syntax and tests
        run: |
          node --check src/legacy/legacyApp.js
          node --check src/core/searchTemplate.js
          git diff --check
          node --test $(find src -name '*.test.js' -print)

      - name: Remove temporary applier and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/apply_exact_grok_hotfix.py .github/workflows/apply-exact-grok-hotfix.yml
          git add -A
          git commit -m "Apply exact Grok contract back and guest hotfix"
          git push origin HEAD:hotfix/grok-contract-back-guest
