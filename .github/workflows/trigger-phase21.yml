name: Finalize migration phase 2.1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'migration/phase-2-1-activity-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/phase-2-1-activity-api
          fetch-depth: 0
      - name: Patch legacy activity bridge
        shell: python
        run: |
          import re
          from pathlib import Path
          p = Path('src/legacy/legacyApp.js')
          s = p.read_text(encoding='utf-8')
          old = """function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    (data.projects||[]).forEach(rememberProjectTasks);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
    if(cloudMode && currentUser){"""
          new = """function persist(options){
  const writeLocal = !options || options.local !== false;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(writeLocal){
      (data.projects||[]).forEach(rememberProjectTasks);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
    }
    if(cloudMode && currentUser){"""
          if s.count(old) != 1:
              raise SystemExit('persist patch anchor mismatch')
          s = s.replace(old, new, 1)
          pattern = r"  \} else if\(type === 'activity'\)\{\n\s+const p=findProject\(pid\); const a=p \? findActivityTemplate\(gid,p\) : null;\n\s+if\(a\)\{ a\.trashed=true; a\.deletedAt=Date\.now\(\); a\.deletedType='activity'; markDirty\(pid\); \}\n\s+\}"
          replacement = "  } else if(type === 'activity'){\n    window.KarhaApp?.activityApi?.trash?.(pid,gid);\n  }"
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('activity patch anchor mismatch')
          p.write_text(s, encoding='utf-8')
      - name: Commit phase 2.1 snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy/legacyApp.js
          git rm -f .github/workflows/apply-phase21.yml .github/workflows/trigger-phase21.yml .github/workflows/finalize-phase21.yml .phase21-trigger
          git commit -m "Finalize activity API legacy bridge"
          git push origin HEAD:migration/phase-2-1-activity-api
