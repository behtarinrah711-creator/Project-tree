name: Apply Grok integrity UI hotfix

on:
  push:
    branches: [hotfix/grok-integrity-ui]
    paths: ['.github/workflows/apply-grok-integrity-ui.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/grok-integrity-ui
          fetch-depth: 0
      - name: Patch files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy=Path('src/legacy/legacyApp.js')
          s=legacy.read_text()

          a=s.index('function findProjectRecordReferences(type, id){')
          b=s.index('\nfunction canDeleteProjectRecord(type, id){',a)
          grok_refs=r'''function findProjectRecordReferences(type, id){
            const targetId = String(id ?? '');
            const refs = [];
            const addRef = (project, label) => {
              refs.push({projectId:project?.id || '', projectName:project?.name || '', label});
            };
            const liveContracts = (project) => (project.contracts || []).filter(c => c && !c.trashed);
            const liveTemplates = (project) => (project.contractTemplates || []).filter(t => t && !t.trashed);
            const liveReports = (project) => (project.contractStatusReports || []).filter(r => r && !r.trashed);
            const liveContacts = (project) => (project.contacts || []).filter(c => c && !c.trashed);
            const liveTasks = (project) => (project.tasks || []).filter(t => t && !t.trashed);

            (data.projects || []).forEach(project=>{
              if(!project || project.trashed) return;

              if(type === 'contact'){
                liveContracts(project).forEach(c=>{
                  if(String(c.contractorId || '') === targetId ||
                     String(c.employerId || '') === targetId ||
                     String(c.contactId || '') === targetId ||
                     String(c.employerContactId || '') === targetId){
                    addRef(project, 'قرارداد');
                  }
                });
                liveReports(project).forEach(r=>{
                  if(String(r.contactId || '') === targetId){
                    addRef(project, 'صورت وضعیت / گزارش قرارداد');
                  }
                });
              }

              if(type === 'activity'){
                liveContacts(project).forEach(c=>{
                  if(Array.isArray(c.activities) && c.activities.some(x=>String(x)===targetId)){
                    addRef(project, 'مخاطب');
                  }
                });
                liveTasks(project).forEach(t=>{
                  if(Array.isArray(t.activities) && t.activities.some(x=>String(x)===targetId)){
                    addRef(project, 'آیتم پروژه');
                  }
                  walkItems(t.subtasks,(item)=>{
                    if(item && !item.trashed && Array.isArray(item.activities) && item.activities.some(x=>String(x)===targetId)){
                      addRef(project, 'زیرآیتم پروژه');
                    }
                  });
                });
                liveTemplates(project).forEach(t=>{
                  if(String(t.activityId || '') === targetId){
                    addRef(project, 'قالب قرارداد');
                  }
                });
                liveContracts(project).forEach(c=>{
                  if(String(c.activityId || '') === targetId ||
                     (Array.isArray(c.activityIds) && c.activityIds.some(x=>String(x)===targetId))){
                    addRef(project, 'قرارداد');
                  }
                });
                liveReports(project).forEach(r=>{
                  if(String(r.activityId || '') === targetId){
                    addRef(project, 'صورت وضعیت / گزارش قرارداد');
                  }
                });
              }

              if(type === 'task' || type === 'subtask' || type === 'sub'){
                const itemIds = new Set([targetId]);
                if(type === 'task'){
                  liveTasks(project).forEach(t=>{
                    if(String(t.id) !== targetId) return;
                    walkItems(t.subtasks,(item)=>{
                      if(item && item.id != null) itemIds.add(String(item.id));
                    });
                  });
                }
                liveContracts(project).forEach(c=>{
                  if(itemIds.has(String(c.projectItemId || ''))){
                    addRef(project, 'قرارداد');
                  }
                });
              }
            });

            return refs;
          }
          '''.replace('          ','')
          s=s[:a]+grok_refs+s[b:]

          a=s.index('function showRecordDeleteBlocked(type, refs){')
          b=s.index('\n/* ---------- soft delete / undo',a)
          block=r'''function showRecordDeleteBlocked(type, refs){
            const noun = type === 'contact' ? 'مخاطب'
              : (type === 'activity' ? 'فعالیت'
              : (type === 'task' ? 'آیتم پروژه'
              : (type === 'sub' || type === 'subtask' ? 'زیرآیتم پروژه' : 'مورد')));
            const places = (refs || []).map(r=>r.label).filter(Boolean);
            const uniquePlaces = [...new Set(places)];
            const where = uniquePlaces.length ? ' (استفاده در: '+uniquePlaces.join('، ')+')' : '';
            showToast('این '+noun+' قابل حذف نیست؛ هنوز در سیستم استفاده شده است'+where);
            return false;
          }
          '''.replace('          ','')
          s=s[:a]+block+s[b:]

          a=s.index('function softDelete(type, pid, tid, sid, label){')
          b=s.index('\n// حذف سراسری رکوردهای خارج از ساختار پروژه',a)
          block=r'''function softDelete(type, pid, tid, sid, label){
            if(type === 'task' || type === 'sub'){
              const checkId = type === 'task' ? tid : sid;
              const checkType = type === 'task' ? 'task' : 'subtask';
              const check = canDeleteProjectRecord(checkType, checkId);
              if(!check.ok){
                showRecordDeleteBlocked(checkType, check.refs);
                return false;
              }
            }
            if(pendingDelete) finalizePendingDelete();
            pendingDelete = { type, pid, tid, sid };
            renderAll();
            if(taskUI?.hasCurrentDetail()) renderSheet();
            if(type === 'project' && !document.getElementById('projectsPage').classList.contains('hidden')) renderManagementPage();
            showUndoToast(label);
            pendingDelete.timeoutId = setTimeout(finalizePendingDelete, 4000);
            return true;
          }
          '''.replace('          ','')
          s=s[:a]+block+s[b:]

          a=s.index('function renderAll(){')
          b=s.index('\nfunction refreshStarredPartial(){',a)
          block=r'''function renderAll(){
            setBottomNavActive('Projects');
            renderTabs();
            setBottomNavActive(data.activeTab==='starred' ? 'Projects' : (document.querySelector('.bottom-nav-item.active')?.id?.replace(/^bottom/,'').replace(/Btn$/,'') || 'Projects'));
            renderModeToggle();
            const content = document.getElementById('content');
            content.innerHTML = '';
            if(data.activeTab === 'starred'){
              renderStarredView(content);
              return;
            }
            const p = findProject(data.activeTab);
            if(!p || p.archived || p.trashed){
              content.innerHTML = '<div class="workspace-no-project">برای ورود به Workspace، از منوی سه‌خطی بالای صفحه یک پروژه را انتخاب کنید. تب «پروژه‌ها» فقط محتوای کاری پروژه فعال را نمایش می‌دهد.</div>';
              return;
            }
            if(window.KarhaApp?.router?.navigate){
              replaceWorkspaceRoute(p.id,'dashboard');
              return;
            }
            replaceWorkspaceRoute(p.id,'dashboard');
            renderProjectView(content, p);
          }
          '''.replace('          ','')
          s=s[:a]+block+s[b:]

          needle="  suppressWorkspaceBack(){ suppressWorkspaceBackOnce=true; },\n  showIncompleteFormExitChoice,"
          repl="  suppressWorkspaceBack(){ suppressWorkspaceBackOnce=true; },\n  canDeleteProjectRecord,\n  showRecordDeleteBlocked,\n  findProjectRecordReferences,\n  showIncompleteFormExitChoice,"
          if needle not in s: raise SystemExit('legacy export anchor not found')
          s=s.replace(needle,repl,1)
          legacy.write_text(s)

          people=Path('src/modules/people/peopleModule.js')
          s=people.read_text()
          old="""function softDeleteContact(projectId, contactId){\n  const deleted=Boolean(contactRepository.softDelete(projectId, contactId));\n  if(deleted) window.KarhaLegacy?.contactFormRuntime?.persistContacts?.(projectId);\n  return deleted;\n}"""
          new="""function softDeleteContact(projectId, contactId){\n  const check = window.KarhaLegacy?.canDeleteProjectRecord?.('contact', contactId);\n  if(check && check.ok === false){\n    window.KarhaLegacy?.showRecordDeleteBlocked?.('contact', check.refs);\n    return false;\n  }\n  const deleted=Boolean(contactRepository.softDelete(projectId, contactId));\n  if(deleted) window.KarhaLegacy?.contactFormRuntime?.persistContacts?.(projectId);\n  return deleted;\n}"""
          if old not in s: raise SystemExit('people anchor not found')
          people.write_text(s.replace(old,new,1))

          activities=Path('src/modules/activities/activitiesModule.js')
          s=activities.read_text()
          old="""function deleteActivity(projectId, activityId){\n  return !!activityRepository.softDelete(projectId, activityId);\n}"""
          new="""function deleteActivity(projectId, activityId){\n  const check = window.KarhaLegacy?.canDeleteProjectRecord?.('activity', activityId);\n  if(check && check.ok === false){\n    window.KarhaLegacy?.showRecordDeleteBlocked?.('activity', check.refs);\n    return false;\n  }\n  return !!activityRepository.softDelete(projectId, activityId);\n}"""
          if old not in s: raise SystemExit('activity anchor not found')
          activities.write_text(s.replace(old,new,1))
          PY
      - name: Verify targeted changes
        run: |
          grep -q "Single render owner\|if(window.KarhaApp?.router?.navigate)" src/legacy/legacyApp.js
          grep -q "canDeleteProjectRecord" src/modules/people/peopleModule.js
          grep -q "canDeleteProjectRecord" src/modules/activities/activitiesModule.js
          git diff --check
      - name: Commit hotfix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-grok-integrity-ui.yml
          git add src/legacy/legacyApp.js src/modules/people/peopleModule.js src/modules/activities/activitiesModule.js
          git commit -m "Apply Grok integrity and single-render hotfix"
          git push origin HEAD:hotfix/grok-integrity-ui
