name: One-shot exact form back applicator
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-apply-exact-form-back.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact prepared patches to hotfix branch
        shell: bash
        env:
          LEGACY_PATCH_B64: 
          REAL_PATCH_B64: 
        run: |
          set -euo pipefail
          git fetch origin hotfix/form-back-save-existing
          git checkout -B hotfix/form-back-save-existing origin/hotfix/form-back-save-existing
          echo "$LEGACY_PATCH_B64" | base64 -d > /tmp/legacy.patch
          echo "$REAL_PATCH_B64" | base64 -d > /tmp/real.patch
          git apply --check /tmp/legacy.patch
          git apply --check /tmp/real.patch
          git apply /tmp/legacy.patch
          git apply /tmp/real.patch
          rm -f .github/workflows/kick-apply-form-back.yml .tmp/kick-apply-form-back
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix contract back handling and persist edited contracts'
          git push origin HEAD:hotfix/form-back-save-existing
      - name: Remove one-shot workflow from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/one-shot-apply-exact-form-back.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove exact one-shot form back applicator'
            git push origin HEAD:main
          fi
