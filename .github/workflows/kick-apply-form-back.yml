name: Kick apply form back hotfix
on:
  push:
    branches:
      - hotfix/form-back-save-existing
    paths:
      - .tmp/kick-apply-form-back
permissions:
  contents: write
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/form-back-save-existing
      - run: |
          echo '# retrigger' >> .github/workflows/apply-form-back-save-existing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/apply-form-back-save-existing.yml
          git commit -m 'Retrigger form back hotfix applicator'
          git push origin HEAD:hotfix/form-back-save-existing
