name: Apply final phase 2.1 legacy patch

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'migration/phase-2-1-activity-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/phase-2-1-activity-api
          fetch-depth: 0
      - name: Patch legacy bridge
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/legacy/legacyApp.js')
          s=p.read_text(encoding='utf-8')
          old="""function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    (data.projects||[]).forEach(rememberProjectTasks);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
    if(cloudMode && currentUser){"""
          new="""function persist(options){
  const writeLocal = !options || options.local !== false;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(writeLocal){
      (data.projects||[]).forEach(rememberProjectTasks);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
    }
    if(cloudMode && currentUser){"""
          if s.count(old)!=1: raise SystemExit('persist anchor mismatch')
          s=s.replace(old,new,1)
          old="""  } else if(type === 'activity'){
    const p=findProject(pid); const a=p ? findActivityTemplate(gid,p) : null;
    if(a){ a.trashed=true; a.deletedAt=Date.now(); a.deletedType='activity'; markDirty(pid); }
  }"""
          new="""  } else if(type === 'activity'){
    window.KarhaApp?.activityApi?.trash?.(pid,gid);
  }"""
          if s.count(old)!=1: raise SystemExit('activity anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit clean patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legacy/legacyApp.js
          git rm .github/workflows/apply-phase21-final.yml
          git commit -m "Finalize activity API legacy bridge"
          git push origin HEAD:migration/phase-2-1-activity-api
