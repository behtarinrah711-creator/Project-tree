<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f3f4;
    --surface:#ffffff;
    --text:#202124;
    --text-dim:#5f6368;
    --divider:#e8eaed;
    --blue:#1a73e8;
    --blue-soft:#e8f0fe;
    --danger:#d93025;
    --danger-soft:#fce8e6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;flex-shrink:0;background:var(--bg);
  }
  .topbar h1{font-size:20px;font-weight:700;margin:0;}
  .mode-toggle{
    display:flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--divider);border-radius:20px;padding:6px 12px;
    font-size:12px;color:var(--text-dim);cursor:pointer;
  }
  .mode-toggle svg{flex-shrink:0;}
  .mode-toggle.active{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-soft);}

  /* ---------- tab bar ---------- */
  .tabbar{
    display:flex;align-items:center;gap:22px;
    padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    flex-shrink:0;scrollbar-width:none;border-bottom:1px solid var(--divider);
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;padding:12px 2px 10px;font-size:14.5px;color:var(--text-dim);
    white-space:nowrap;position:relative;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .tab.active{color:var(--blue);font-weight:600;}
  .tab.active::after{
    content:'';position:absolute;right:0;left:0;bottom:-1px;height:2px;background:var(--blue);border-radius:2px;
  }
  .tab .count{
    font-size:11px;color:var(--text-dim);background:var(--divider);border-radius:10px;
    padding:1px 6px;
  }
  .tab.star-tab{color:var(--blue);}
  .tab.add-tab{color:var(--text-dim);font-weight:600;font-size:18px;padding:10px 6px;}

  /* ---------- content ---------- */
  .content{flex:1;overflow-y:auto;padding:8px 0 100px;-webkit-overflow-scrolling:touch;}
  .cost-summary{
    padding:10px 16px 2px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-dim);
    display:flex;justify-content:space-between;
  }
  .cost-summary b{color:var(--blue);font-weight:600;}

  .task-block{border-bottom:1px solid var(--divider);}
  .row{
    display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;
  }
  .row.sub{padding-right:52px;padding-top:9px;padding-bottom:9px;}
  .row.completed .row-title{color:var(--text-dim);text-decoration:line-through;}

  .circle{
    width:22px;height:22px;flex-shrink:0;border-radius:50%;
    border:1.8px solid #80868b;display:flex;align-items:center;justify-content:center;
    color:transparent;transition:.15s ease;
  }
  .row.sub .circle{width:18px;height:18px;}
  .circle.checked{background:var(--blue);border-color:var(--blue);color:#fff;}
  .row-body{flex:1;min-width:0;}
  .row-title{font-size:15px;line-height:1.4;overflow-wrap:anywhere;}
  .row.sub .row-title{font-size:13.5px;color:#3c4043;}
  .row-cost{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);flex-shrink:0;
  }
  .star-icon{
    width:20px;height:20px;flex-shrink:0;color:#c4c7c5;display:flex;align-items:center;justify-content:center;
  }
  .star-icon.starred{color:var(--blue);}
  .row.sub .star-icon{width:17px;height:17px;}

  .add-task-row{
    display:flex;align-items:center;gap:14px;padding:12px 16px;color:var(--text-dim);cursor:pointer;
  }
  .add-task-row .plus-circle{
    width:22px;height:22px;border-radius:50%;border:1.8px dashed #9aa0a6;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  .completed-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;
    border-top:1px solid var(--divider);margin-top:6px;
  }
  .completed-header .chev{color:var(--text-dim);transition:transform .15s ease;}
  .completed-header .chev.collapsed{transform:rotate(-90deg);}
  .completed-list.hidden{display:none;}

  .starred-tag{
    font-size:11px;color:var(--blue);background:var(--blue-soft);border-radius:6px;
    padding:2px 6px;flex-shrink:0;margin-inline-start:6px;
  }

  .empty-state{
    text-align:center;padding:70px 24px;color:var(--text-dim);font-size:14px;
  }

  .inline-add-row{
    display:flex;align-items:center;gap:14px;padding:12px 16px;color:var(--text-dim);cursor:pointer;
  }
  .inline-add-row .plus-circle{
    width:20px;height:20px;border-radius:50%;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .inline-add-row.active{cursor:default;}
  .inline-add-row .empty-check{
    width:20px;height:20px;border-radius:3px;border:1.8px solid #80868b;flex-shrink:0;
  }
  .inline-add-row input{
    flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:var(--text);
  }
  .inline-add-row .x-btn{
    width:26px;height:26px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  /* ---------- modal / detail popup ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;
    z-index:50;
  }
  .overlay.hidden{display:none;}
  .sheet{
    background:var(--surface);width:100%;max-height:88vh;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-bottom:1px solid var(--divider);flex-shrink:0;
  }
  .sheet-head .close-btn{
    width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .sheet-head .close-btn:active{background:var(--divider);}
  .sheet-body{overflow-y:auto;padding:16px;}

  .detail-title-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;}
  .detail-title-row .circle{margin-top:3px;}
  .detail-title{
    flex:1;font-size:17px;font-weight:600;border:none;outline:none;background:transparent;
    font-family:inherit;color:var(--text);resize:none;line-height:1.5;
  }
  .detail-field{margin-bottom:16px;}
  .detail-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .detail-cost-input, .sub-add-input{
    width:100%;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);
    border:1px solid var(--divider);border-radius:8px;padding:9px 12px;outline:none;
  }
  .sub-add-input{font-family:'Vazirmatn',Tahoma,sans-serif;}
  .detail-cost-input:focus, .sub-add-input:focus{border-color:var(--blue);}

  .detail-star-row{
    display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:14px;color:var(--text-dim);cursor:pointer;
  }
  .detail-star-row .star-icon{width:22px;height:22px;}

  .sub-item{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .sub-item input.sub-text{
    flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;color:var(--text);
  }
  .sub-item .circle{width:18px;height:18px;}
  .sub-item .star-icon{width:17px;height:17px;}
  .sub-del{
    width:26px;height:26px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sub-del:active{color:var(--danger);}

  .add-sub-row{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .add-sub-row .add-sub-btn{
    flex-shrink:0;width:36px;height:36px;border-radius:8px;border:none;background:var(--blue-soft);
    color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }

  .delete-task-btn{
    width:100%;margin-top:8px;padding:12px;border-radius:8px;border:1px solid var(--danger-soft);
    background:var(--danger-soft);color:var(--danger);font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;
  }
  .confirm-btn{
    width:100%;margin-top:8px;padding:13px;border-radius:8px;border:none;
    background:#1e8e3e;color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;
  }
  .confirm-btn:active{background:#186c30;}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:#323232;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="topbar">
  <h1>کارها</h1>
  <div class="mode-toggle" id="modeToggle">
    <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 8h16M7 8v8" stroke="currentColor" stroke-width="1.5"/></svg>
    <span id="modeToggleLabel">نمایش هزینه</span>
  </div>
</div>

<div class="tabbar" id="tabbar"></div>
<div class="content" id="content"></div>

<div class="overlay hidden" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <button class="close-btn" id="deleteSheetBtn" title="حذف">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V2.6c0-.4.3-.7.7-.7h2.6c.4 0 .7.3.7.7V4M6.6 7v5M9.4 7v5M3.7 4l.6 9.2c0 .6.5 1 1.1 1h5.2c.6 0 1.1-.4 1.1-1L12.3 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span style="font-size:13px;color:#5f6368;">جزئیات</span>
      <button class="close-btn" id="closeSheetBtn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'gtasks-clone-v2';
let data = null;
let saveTimer = null;

function uid(){ return 'i' + Math.random().toString(36).slice(2,10); }
function makeTask(text){ return {id:uid(), text, done:false, starred:false, cost:null, subtasks:[]}; }
function makeSub(text){ return {id:uid(), text, done:false, starred:false, cost:null}; }
function makeProject(name){ return {id:uid(), name, tasks:[], completedOpen:false}; }

function seedData(){
  const zeitoun = makeProject('پروژه زیتون');
  const bargh = makeTask('برق کشی');
  bargh.subtasks.push(makeSub('هماهنگی با صابر'));
  const loole = makeTask('لوله کشی تاسیسات');
  loole.subtasks.push(makeSub('هماهنگی با فیروز پور'));
  zeitoun.tasks.push(bargh, loole);

  const ghamshe = makeProject('پروژه قمشه');
  const kandan = makeTask('کندن کف محوطه');
  kandan.subtasks.push(makeSub('هماهنگ کردن بیل مکانیکی'));
  ghamshe.tasks.push(kandan);

  return { projects:[zeitoun, ghamshe], viewMode:'simple', activeTab: zeitoun.id };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ data = JSON.parse(raw); return; }
  }catch(e){}
  data = seedData();
  persist();
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
  }, 120);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function findProject(pid){ return data.projects.find(p=>p.id===pid); }
function findTask(pid, tid){ const p = findProject(pid); return p ? p.tasks.find(t=>t.id===tid) : null; }
function findSub(pid, tid, sid){ const t = findTask(pid, tid); return t ? t.subtasks.find(s=>s.id===sid) : null; }

function toPersianDigits(str){ return String(str).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function toEnglishDigits(str){ return String(str).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function formatCost(n){ if(n===null || n===undefined || n==='' || isNaN(n)) return toPersianDigits('0'); return toPersianDigits(Math.round(n).toLocaleString('en-US')); }
function taskCostSum(task){
  let total = parseFloat(task.cost)||0;
  task.subtasks.forEach(s => total += (parseFloat(s.cost)||0));
  return total;
}
function projectCostSum(project){
  return project.tasks.reduce((sum,t)=> sum + taskCostSum(t), 0);
}

function toggleTaskDone(pid, tid){
  const t = findTask(pid, tid);
  t.done = !t.done;
  t.subtasks.forEach(s => s.done = t.done);
  persist(); renderAll();
}
function toggleSubDone(pid, tid, sid){
  const s = findSub(pid, tid, sid);
  s.done = !s.done;
  persist(); renderAll();
}
function toggleTaskStar(pid, tid){ const t = findTask(pid,tid); t.starred = !t.starred; persist(); renderAll(); }
function toggleSubStar(pid, tid, sid){ const s = findSub(pid,tid,sid); s.starred = !s.starred; persist(); renderAll(); }

function deleteTask(pid, tid){
  const p = findProject(pid);
  p.tasks = p.tasks.filter(t => t.id !== tid);
  persist(); closeSheet(); renderAll();
}
function deleteSub(pid, tid, sid){
  const t = findTask(pid, tid);
  t.subtasks = t.subtasks.filter(s => s.id !== sid);
  persist(); renderAll(); if(currentDetail) openTaskDetail(pid, tid);
}
function addTaskToProject(pid, text){
  if(!text || !text.trim()) return;
  const p = findProject(pid);
  p.tasks.push(makeTask(text.trim()));
  persist(); renderAll();
}
function addSubToTask(pid, tid, text){
  if(!text || !text.trim()) return;
  const t = findTask(pid, tid);
  t.subtasks.push(makeSub(text.trim()));
  persist(); renderAll(); if(currentDetail) openTaskDetail(pid, tid);
}
function addProject(name){
  if(!name || !name.trim()) return;
  const p = makeProject(name.trim());
  data.projects.push(p);
  data.activeTab = p.id;
  persist(); renderAll();
}
function deleteProject(pid){
  data.projects = data.projects.filter(p=>p.id!==pid);
  if(data.activeTab === pid){
    data.activeTab = data.projects.length ? data.projects[0].id : 'starred';
  }
  persist(); renderAll();
}

/* ---------- svg icons ---------- */
function svgCheck(){ return '<svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5l3.5 3.5L12 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function svgStar(filled){ return '<svg width="18" height="18" viewBox="0 0 20 20" fill="'+(filled?'currentColor':'none')+'"><path d="M10 1.8l2.5 5.2 5.6.6-4.2 3.8 1.1 5.6L10 14.2l-5 2.8 1.1-5.6-4.2-3.8 5.6-.6L10 1.8z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>'; }
function svgChevron(){ return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function svgTrash(){ return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V2.6c0-.4.3-.7.7-.7h2.6c.4 0 .7.3.7.7V4M6.6 7v5M9.4 7v5M3.7 4l.6 9.2c0 .6.5 1 1.1 1h5.2c.6 0 1.1-.4 1.1-1L12.3 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function svgPlus(){ return '<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1v13M1 7.5h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'; }

/* ---------- collect starred ---------- */
function collectStarred(){
  const out = [];
  data.projects.forEach(p=>{
    p.tasks.forEach(t=>{
      if(t.starred) out.push({pid:p.id, tid:t.id, sid:null, text:t.text, done:t.done, cost:t.cost, projectName:p.name});
      t.subtasks.forEach(s=>{
        if(s.starred) out.push({pid:p.id, tid:t.id, sid:s.id, text:s.text, done:s.done, cost:s.cost, projectName:p.name});
      });
    });
  });
  return out;
}

/* ---------- tab bar ---------- */
function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';

  const starTab = document.createElement('div');
  starTab.className = 'tab star-tab' + (data.activeTab==='starred' ? ' active' : '');
  starTab.innerHTML = svgStar(true);
  starTab.onclick = ()=>{ data.activeTab = 'starred'; addItemActive = false; persist(); renderAll(); };
  bar.appendChild(starTab);

  data.projects.forEach(p=>{
    const undone = p.tasks.filter(t=>!t.done).length;
    const tab = document.createElement('div');
    tab.className = 'tab' + (data.activeTab===p.id ? ' active' : '');
    tab.innerHTML = '<span>'+escapeHtml(p.name)+'</span>' + (undone ? '<span class="count">'+undone+'</span>' : '');
    tab.onclick = ()=>{ data.activeTab = p.id; addItemActive = false; persist(); renderAll(); };
    tab.oncontextmenu = (e)=>{ e.preventDefault(); };
    bar.appendChild(tab);
  });

  const addTab = document.createElement('div');
  addTab.className = 'tab add-tab';
  addTab.textContent = '+';
  addTab.onclick = ()=>{
    const name = prompt('نام پروژهٔ جدید:');
    if(name && name.trim()) addProject(name);
  };
  bar.appendChild(addTab);
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

/* ---------- content ---------- */
let currentDetail = null;
let addItemActive = false;

function renderAll(){
  renderTabs();
  renderModeToggle();
  const content = document.getElementById('content');
  content.innerHTML = '';
  if(data.activeTab === 'starred'){
    renderStarredView(content);
  } else {
    const p = findProject(data.activeTab);
    if(!p){ content.innerHTML = '<div class="empty-state">پروژه‌ای انتخاب نشده. از نوار بالا یکی را بسازید.</div>'; return; }
    renderProjectView(content, p);
  }
}

function renderModeToggle(){
  const btn = document.getElementById('modeToggle');
  const label = document.getElementById('modeToggleLabel');
  if(data.viewMode === 'cost'){ btn.classList.add('active'); label.textContent = 'نمایش ساده'; }
  else { btn.classList.remove('active'); label.textContent = 'نمایش هزینه'; }
}
document.getElementById('modeToggle').onclick = ()=>{
  data.viewMode = data.viewMode === 'cost' ? 'simple' : 'cost';
  persist(); renderAll();
};

function renderProjectView(content, p){
  if(data.viewMode === 'cost'){
    const summary = document.createElement('div');
    summary.className = 'cost-summary';
    summary.innerHTML = '<span>برآورد هزینهٔ کل پروژه</span><b>'+formatCost(projectCostSum(p))+'</b>';
    content.appendChild(summary);
  }

  const active = p.tasks.filter(t=>!t.done);
  const completed = p.tasks.filter(t=>t.done);

  if(!active.length && !completed.length){
    content.appendChild(elFromHtml('<div class="empty-state">کاری در این پروژه نیست. با دکمهٔ + یکی اضافه کنید.</div>'));
  }

  active.forEach(t => content.appendChild(renderTaskBlock(p, t)));

  content.appendChild(renderInlineAddRow(p));

  if(completed.length){
    const header = document.createElement('div');
    header.className = 'completed-header';
    header.innerHTML = '<span>تکمیل‌شده ('+completed.length+')</span><span class="chev'+(p.completedOpen?'':' collapsed')+'">'+svgChevron()+'</span>';
    header.onclick = ()=>{ p.completedOpen = !p.completedOpen; persist(); renderAll(); };
    content.appendChild(header);

    const list = document.createElement('div');
    list.className = 'completed-list' + (p.completedOpen ? '' : ' hidden');
    completed.forEach(t => list.appendChild(renderTaskBlock(p, t)));
    content.appendChild(list);
  }
}

function renderInlineAddRow(p){
  const row = document.createElement('div');

  if(!addItemActive){
    row.className = 'inline-add-row';
    row.innerHTML = '<span class="plus-circle">'+svgPlus()+'</span><span>افزودن مورد</span>';
    row.onclick = ()=>{ addItemActive = true; renderAll(); focusInlineAdd(); };
    return row;
  }

  row.className = 'inline-add-row active';
  const check = document.createElement('span');
  check.className = 'empty-check';
  row.appendChild(check);

  const input = document.createElement('input');
  input.id = 'inlineAddInput';
  input.placeholder = 'مورد جدید…';

  const commit = ()=>{
    if(input.value.trim()){
      addTaskToProject(p.id, input.value);
      addItemActive = true;
      renderAll();
      focusInlineAdd();
    }
  };
  input.onkeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    if(e.key==='Escape'){ addItemActive = false; renderAll(); }
  };
  input.onblur = ()=>{
    setTimeout(()=>{
      if(document.activeElement && document.activeElement.id==='inlineAddInput') return;
      if(input.value.trim()) commit();
      else { addItemActive = false; renderAll(); }
    }, 120);
  };
  row.appendChild(input);

  const xBtn = document.createElement('button');
  xBtn.className = 'x-btn';
  xBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  xBtn.onclick = ()=>{ addItemActive = false; renderAll(); };
  row.appendChild(xBtn);

  return row;
}
function focusInlineAdd(){
  setTimeout(()=>{
    const el = document.getElementById('inlineAddInput');
    if(el) el.focus();
  }, 0);
}

function renderTaskBlock(p, t){
  const block = document.createElement('div');
  block.className = 'task-block';

  const row = document.createElement('div');
  row.className = 'row' + (t.done ? ' completed' : '');
  row.appendChild(buildCircle(t.done, (e)=>{ e.stopPropagation(); toggleTaskDone(p.id, t.id); }));
  const body = document.createElement('div');
  body.className = 'row-body';
  const title = document.createElement('div');
  title.className = 'row-title';
  title.textContent = t.text;
  body.appendChild(title);
  row.appendChild(body);
  if(data.viewMode === 'cost'){
    const c = document.createElement('span');
    c.className = 'row-cost';
    c.textContent = formatCost(taskCostSum(t));
    row.appendChild(c);
  }
  row.appendChild(buildStar(t.starred, (e)=>{ e.stopPropagation(); toggleTaskStar(p.id, t.id); }));
  row.onclick = ()=> openTaskDetail(p.id, t.id);
  block.appendChild(row);

  t.subtasks.forEach(s=>{
    const srow = document.createElement('div');
    srow.className = 'row sub' + (s.done ? ' completed' : '');
    srow.appendChild(buildCircle(s.done, (e)=>{ e.stopPropagation(); toggleSubDone(p.id, t.id, s.id); }, true));
    const sbody = document.createElement('div');
    sbody.className = 'row-body';
    const stitle = document.createElement('div');
    stitle.className = 'row-title';
    stitle.textContent = s.text;
    sbody.appendChild(stitle);
    srow.appendChild(sbody);
    if(data.viewMode === 'cost' && s.cost){
      const c = document.createElement('span');
      c.className = 'row-cost';
      c.textContent = formatCost(s.cost);
      srow.appendChild(c);
    }
    srow.appendChild(buildStar(s.starred, (e)=>{ e.stopPropagation(); toggleSubStar(p.id, t.id, s.id); }));
    srow.onclick = ()=> openSubDetail(p.id, t.id, s.id);
    block.appendChild(srow);
  });

  return block;
}

function renderStarredView(content){
  const items = collectStarred();
  if(!items.length){
    content.appendChild(elFromHtml('<div class="empty-state">هنوز چیزی ستاره‌دار نشده. کنار هر کار روی ستاره بزنید.</div>'));
    return;
  }
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'row' + (item.done ? ' completed' : '');
    row.appendChild(buildCircle(item.done, (e)=>{
      e.stopPropagation();
      if(item.sid) toggleSubDone(item.pid, item.tid, item.sid);
      else toggleTaskDone(item.pid, item.tid);
    }));
    const body = document.createElement('div');
    body.className = 'row-body';
    const title = document.createElement('div');
    title.className = 'row-title';
    title.textContent = item.text;
    body.appendChild(title);
    const tag = document.createElement('span');
    tag.className = 'starred-tag';
    tag.textContent = item.projectName;
    body.appendChild(tag);
    row.appendChild(body);
    row.appendChild(buildStar(true, (e)=>{
      e.stopPropagation();
      if(item.sid) toggleSubStar(item.pid, item.tid, item.sid);
      else toggleTaskStar(item.pid, item.tid);
    }));
    row.onclick = ()=>{
      if(item.sid) openSubDetail(item.pid, item.tid, item.sid);
      else openTaskDetail(item.pid, item.tid);
    };
    content.appendChild(row);
  });
}

function buildCircle(checked, onClick, small){
  const c = document.createElement('span');
  c.className = 'circle' + (checked ? ' checked' : '');
  c.innerHTML = checked ? svgCheck() : '';
  c.onclick = onClick;
  return c;
}
function buildStar(starred, onClick){
  const s = document.createElement('span');
  s.className = 'star-icon' + (starred ? ' starred' : '');
  s.innerHTML = svgStar(starred);
  s.onclick = onClick;
  return s;
}
function elFromHtml(html){
  const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild;
}

/* ---------- detail sheet ---------- */

function openTaskDetail(pid, tid){
  currentDetail = {pid, tid, sid:null};
  renderSheet();
  document.getElementById('overlay').classList.remove('hidden');
}
function openSubDetail(pid, tid, sid){
  currentDetail = {pid, tid, sid};
  renderSheet();
  document.getElementById('overlay').classList.remove('hidden');
}
function closeSheet(){
  currentDetail = null;
  document.getElementById('overlay').classList.add('hidden');
  renderAll();
}
document.getElementById('closeSheetBtn').onclick = closeSheet;
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeSheet(); };

function renderSheet(){
  if(!currentDetail) return;
  const { pid, tid, sid } = currentDetail;
  const body = document.getElementById('sheetBody');
  body.innerHTML = '';

  const isSub = !!sid;
  const item = isSub ? findSub(pid, tid, sid) : findTask(pid, tid);
  if(!item){ closeSheet(); return; }

  const titleRow = document.createElement('div');
  titleRow.className = 'detail-title-row';
  titleRow.appendChild(buildCircle(item.done, ()=>{
    if(isSub) toggleSubDone(pid, tid, sid); else toggleTaskDone(pid, tid);
    if(currentDetail) renderSheet();
  }));
  const titleInput = document.createElement('textarea');
  titleInput.className = 'detail-title';
  titleInput.rows = 1;
  titleInput.value = item.text;
  titleInput.oninput = ()=>{ titleInput.style.height='auto'; titleInput.style.height = titleInput.scrollHeight+'px'; };
  titleInput.onblur = ()=>{
    item.text = titleInput.value.trim() || item.text;
    persist(); renderAll();
  };
  titleRow.appendChild(titleInput);
  body.appendChild(titleRow);

  const starRow = document.createElement('div');
  starRow.className = 'detail-star-row';
  const starIcon = buildStar(item.starred, (e)=>{
    e.stopPropagation();
    if(isSub) toggleSubStar(pid, tid, sid); else toggleTaskStar(pid, tid);
    if(currentDetail) renderSheet();
  });
  starRow.appendChild(starIcon);
  starRow.onclick = ()=>{
    if(isSub) toggleSubStar(pid, tid, sid); else toggleTaskStar(pid, tid);
    if(currentDetail) renderSheet();
  };
  body.appendChild(starRow);

  if(!isSub){
    const subField = document.createElement('div');
    subField.className = 'detail-field';
    subField.innerHTML = '<div class="detail-label">زیرمجموعه‌ها</div>';
    item.subtasks.forEach(s=>{
      const row = document.createElement('div');
      row.className = 'sub-item';
      row.appendChild(buildCircle(s.done, ()=>{ toggleSubDone(pid, tid, s.id); if(currentDetail) renderSheet(); }, true));
      const input = document.createElement('input');
      input.className = 'sub-text';
      input.value = s.text;
      input.onblur = ()=>{ s.text = input.value.trim() || s.text; persist(); renderAll(); };
      row.appendChild(input);
      const del = document.createElement('button');
      del.className = 'sub-del';
      del.innerHTML = svgTrash();
      del.onclick = ()=> deleteSub(pid, tid, s.id);
      row.appendChild(del);
      subField.appendChild(row);
    });

    const addRow = document.createElement('div');
    addRow.className = 'add-sub-row';
    const addInput = document.createElement('input');
    addInput.className = 'sub-add-input';
    addInput.placeholder = 'افزودن زیرمجموعه…';
    const addBtn = document.createElement('button');
    addBtn.className = 'add-sub-btn';
    addBtn.innerHTML = svgPlus();
    const commitAdd = ()=>{
      if(addInput.value.trim()){
        addSubToTask(pid, tid, addInput.value);
      }
    };
    addBtn.onclick = commitAdd;
    addInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); commitAdd(); } };
    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    subField.appendChild(addRow);

    body.appendChild(subField);
  }

  const costField = document.createElement('div');
  costField.className = 'detail-field';
  costField.innerHTML = '<div class="detail-label">برآورد هزینه (تومان)</div>';
  const costInput = document.createElement('input');
  costInput.type = 'text';
  costInput.className = 'detail-cost-input';
  costInput.placeholder = '۰';
  costInput.inputMode = 'decimal';
  costInput.value = (item.cost===null || item.cost===undefined || item.cost==='') ? '' : formatCost(item.cost);
  costInput.oninput = ()=>{
    const rawDigits = toEnglishDigits(costInput.value).replace(/[^0-9]/g,'');
    item.cost = rawDigits === '' ? null : parseFloat(rawDigits);
    costInput.value = rawDigits === '' ? '' : toPersianDigits(parseInt(rawDigits,10).toLocaleString('en-US'));
    persist();
  };
  costInput.onblur = ()=>{
    costInput.value = (item.cost===null || item.cost===undefined) ? '' : formatCost(item.cost);
  };
  costField.appendChild(costInput);
  body.appendChild(costField);

  document.getElementById('deleteSheetBtn').onclick = ()=>{
    const msg = isSub ? 'این زیرمجموعه حذف شود؟' : 'این کار و همهٔ زیرمجموعه‌هایش حذف شود؟';
    if(confirm(msg)){
      if(isSub){
        const t = findTask(pid, tid);
        if(t) t.subtasks = t.subtasks.filter(s => s.id !== sid);
        persist(); closeSheet(); renderAll();
      } else {
        deleteTask(pid, tid);
      }
    }
  };

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'confirm-btn';
  confirmBtn.textContent = 'تایید';
  confirmBtn.onclick = ()=>{
    item.text = titleInput.value.trim() || item.text;
    const rawDigits = toEnglishDigits(costInput.value).replace(/[^0-9]/g,'');
    item.cost = rawDigits === '' ? null : parseFloat(rawDigits);
    persist();
    closeSheet();
  };
  body.appendChild(confirmBtn);
}

/* ---------- init ---------- */
loadData();
if(data.activeTab !== 'starred' && !findProject(data.activeTab)){
  data.activeTab = data.projects.length ? data.projects[0].id : 'starred';
}
renderAll();
</script>
</body>
</html>
