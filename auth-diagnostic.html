<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auth diagnostic</title><style>body{font-family:system-ui,sans-serif;padding:20px;line-height:1.8;background:#f6f7f9;color:#111}.box{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.ok{color:#087a2f}.bad{color:#b00020}.wait{color:#765900}button{padding:12px 16px;border-radius:10px;border:0;background:#111;color:#fff;font-size:16px}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><h2>Karha Auth Diagnostic</h2><div class="box"><div id="summary">در حال تست…</div></div><div class="box"><button id="run">اجرای دوباره تست</button></div><div class="box"><pre id="log"></pre></div><script>const logEl=document.getElementById('log'),sum=document.getElementById('summary');function log(s,cls=''){const d=document.createElement('div');d.textContent=s;if(cls)d.className=cls;logEl.appendChild(d)}async function probe(name,url,opts={}){const t=Date.now();try{const r=await fetch(url,{cache:'no-store',...opts});log(`✅ ${name}: HTTP ${r.status} (${Date.now()-t}ms)`,'ok');return true}catch(e){log(`❌ ${name}: ${e.name}: ${e.message} (${Date.now()-t}ms)`,'bad');return false}}async function noCors(name,url){const t=Date.now();try{await fetch(url,{mode:'no-cors',cache:'no-store'});log(`✅ ${name}: network reachable (${Date.now()-t}ms)`,'ok');return true}catch(e){log(`❌ ${name}: ${e.name}: ${e.message} (${Date.now()-t}ms)`,'bad');return false}}async function run(){logEl.textContent='';sum.textContent='در حال تست…';log(`navigator.onLine = ${navigator.onLine}`);log(`UA = ${navigator.userAgent}`);const api='AIzaSyBbRk4MsdHtj-gWnjbJExvQgW0sY6Z4uK8';const results=[];results.push(await probe('GitHub Pages current file',location.href));results.push(await probe('Firebase public config',`https://identitytoolkit.googleapis.com/v1/projects?key=${api}`));results.push(await noCors('Firebase auth handler','https://tree-d92af.firebaseapp.com/__/auth/handler'));results.push(await noCors('Google Accounts','https://accounts.google.com/'));results.push(await noCors('Google APIs','https://www.googleapis.com/'));const ok=results.every(Boolean);sum.textContent=ok?'همه مسیرهای پایه از این گوشی قابل دسترسی‌اند.':'حداقل یک مسیر شبکه از این گوشی قابل دسترسی نیست؛ خطوط قرمز را اسکرین‌شات بگیر.';sum.className=ok?'ok':'bad'}document.getElementById('run').onclick=run;run();</script></body></html>
