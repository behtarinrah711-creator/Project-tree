<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">

<style>
  :root{
    --bg:#f1f3f4;
    --surface:#ffffff;
    --text:#202124;
    --text-dim:#5f6368;
    --divider:#e8eaed;
    --blue:#1a73e8;
    --blue-soft:#e8f0fe;
    --danger:#d93025;
    --danger-soft:#fce8e6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 10px 8px;flex-shrink:0;background:var(--bg);
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;background:transparent;
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .icon-btn:active{background:var(--divider);}
  .avatar-circle{
    width:32px;height:32px;border-radius:50%;background:#9aa0a6;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700;
  }
  .mode-toggle{
    display:flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--divider);border-radius:20px;padding:6px 12px;
    font-size:12px;color:var(--text-dim);cursor:pointer;
  }
  .mode-toggle svg{flex-shrink:0;}
  .mode-toggle.active{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-soft);}

  /* ---------- tab bar ---------- */
  .tabbar{
    display:flex;align-items:center;gap:22px;
    padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    flex-shrink:0;scrollbar-width:none;border-bottom:1px solid var(--divider);
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;padding:12px 2px 10px;font-size:14.5px;color:var(--text-dim);
    white-space:nowrap;position:relative;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .tab.active{color:var(--blue);font-weight:600;}
  .tab.active::after{
    content:'';position:absolute;right:0;left:0;bottom:-1px;height:2px;background:var(--blue);border-radius:2px;
  }
  .tab .count{
    font-size:11px;color:var(--text-dim);background:var(--divider);border-radius:10px;
    padding:1px 6px;
  }
  .tab.star-tab{color:var(--blue);}
  .tab.add-tab{color:var(--text-dim);font-weight:600;font-size:18px;padding:10px 6px;}

  /* ---------- content ---------- */
  .content{flex:1;overflow-y:auto;padding:8px 0 100px;-webkit-overflow-scrolling:touch;}
  .cost-summary{
    padding:10px 16px 2px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-dim);
    display:flex;justify-content:space-between;
  }
  .cost-summary b{color:var(--blue);font-weight:600;}

  .task-block{border-bottom:1px solid var(--divider);}
  .row{
    display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;
  }
  .row.sub{padding-right:52px;padding-top:9px;padding-bottom:9px;}
  .row.completed .row-title{color:var(--text-dim);text-decoration:line-through;}

  .circle{
    width:22px;height:22px;flex-shrink:0;border-radius:50%;
    border:1.8px solid #80868b;display:flex;align-items:center;justify-content:center;
    color:transparent;transition:.15s ease;
  }
  .row.sub .circle{width:18px;height:18px;}
  .circle.checked{background:var(--blue);border-color:var(--blue);color:#fff;}
  .row-body{flex:1;min-width:0;}
  .row-title{font-size:15px;line-height:1.4;overflow-wrap:anywhere;}
  .row.sub .row-title{font-size:13.5px;color:#3c4043;}
  .row-cost{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);flex-shrink:0;
  }
  .star-icon{
    width:20px;height:20px;flex-shrink:0;color:#c4c7c5;display:flex;align-items:center;justify-content:center;
  }
  .star-icon.starred{color:var(--blue);}
  .row.sub .star-icon{width:17px;height:17px;}

  .add-task-row{
    display:flex;align-items:center;gap:14px;padding:12px 16px;color:var(--text-dim);cursor:pointer;
  }
  .add-task-row .plus-circle{
    width:22px;height:22px;border-radius:50%;border:1.8px dashed #9aa0a6;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  .completed-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;
    border-top:1px solid var(--divider);margin-top:6px;
  }
  .completed-header .chev{color:var(--text-dim);transition:transform .15s ease;}
  .completed-header .chev.collapsed{transform:rotate(-90deg);}
  .completed-list.hidden{display:none;}

  .starred-tag{
    font-size:11px;color:var(--blue);background:var(--blue-soft);border-radius:6px;
    padding:2px 6px;flex-shrink:0;margin-inline-start:6px;
  }

  .empty-state{
    text-align:center;padding:70px 24px;color:var(--text-dim);font-size:14px;
  }

  .inline-add-row{
    display:flex;align-items:center;gap:14px;padding:12px 16px;color:var(--text-dim);cursor:pointer;
  }
  .inline-add-row .plus-circle{
    width:20px;height:20px;border-radius:50%;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .inline-add-row.active{cursor:default;}
  .inline-add-row .empty-check{
    width:20px;height:20px;border-radius:3px;border:1.8px solid #80868b;flex-shrink:0;
  }
  .inline-add-row input{
    flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:var(--text);
  }
  .inline-add-row .x-btn{
    width:26px;height:26px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  /* ---------- modal / detail popup ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;
    z-index:50;
  }
  .overlay.hidden{display:none;}
  .sheet{
    background:var(--surface);width:100%;max-height:88vh;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-bottom:1px solid var(--divider);flex-shrink:0;
  }
  .sheet-head .close-btn{
    width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .sheet-head .close-btn:active{background:var(--divider);}
  .sheet-body{overflow-y:auto;padding:16px;}

  .detail-title-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;}
  .detail-title-row .circle{margin-top:3px;}
  .detail-title{
    flex:1;font-size:17px;font-weight:600;border:none;outline:none;background:transparent;
    font-family:inherit;color:var(--text);resize:none;line-height:1.5;
  }
  .detail-field{margin-bottom:16px;}
  .detail-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .detail-cost-input, .sub-add-input{
    width:100%;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);
    border:1px solid var(--divider);border-radius:8px;padding:9px 12px;outline:none;
  }
  .sub-add-input{font-family:'Vazirmatn',Tahoma,sans-serif;}
  .detail-cost-input:focus, .sub-add-input:focus{border-color:var(--blue);}

  .detail-star-row{
    display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:14px;color:var(--text-dim);cursor:pointer;
  }
  .detail-star-row .star-icon{width:22px;height:22px;}

  .sub-item{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .sub-item input.sub-text{
    flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;color:var(--text);
  }
  .sub-item .circle{width:18px;height:18px;}
  .sub-item .star-icon{width:17px;height:17px;}
  .sub-del{
    width:26px;height:26px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sub-del:active{color:var(--danger);}

  .add-sub-row{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .add-sub-row .add-sub-btn{
    flex-shrink:0;width:36px;height:36px;border-radius:8px;border:none;background:var(--blue-soft);
    color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }

  .delete-task-btn{
    width:100%;margin-top:8px;padding:12px;border-radius:8px;border:1px solid var(--danger-soft);
    background:var(--danger-soft);color:var(--danger);font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;
  }
  .confirm-btn{
    width:100%;margin-top:8px;padding:13px;border-radius:8px;border:none;
    background:#1e8e3e;color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;
  }
  .confirm-btn:active{background:#186c30;}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:#323232;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:60;
  }
  .toast.show{opacity:1;}

  /* ---------- side drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;
    display:flex;justify-content:flex-end;
  }
  .drawer-overlay.hidden{display:none;}
  .drawer{
    width:78%;max-width:320px;background:var(--surface);height:100%;
    padding:22px 18px;box-shadow:-2px 0 10px rgba(0,0,0,.15);
    display:flex;flex-direction:column;
  }
  .drawer-account{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .avatar-circle.big{width:44px;height:44px;}
  .drawer-account-name{font-size:15px;font-weight:600;}
  .drawer-account-sub{font-size:12.5px;color:var(--text-dim);}
  .drawer-signin-btn{
    width:100%;padding:11px;border-radius:8px;border:1px solid var(--divider);
    background:var(--surface);color:var(--blue);font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;margin-bottom:16px;
  }
  .drawer-signin-btn:active{background:var(--blue-soft);}
  .drawer-divider{height:1px;background:var(--divider);margin:6px 0 14px;}
  .drawer-item{
    display:flex;align-items:center;gap:14px;padding:10px 4px;cursor:pointer;font-size:14.5px;color:var(--text);
  }
  .drawer-item:active{background:var(--divider);border-radius:8px;}
  .drawer-item-note{font-size:12px;color:var(--text-dim);padding:8px 4px;line-height:1.6;}

  /* ---------- mini dialogs (centered) ---------- */
  .mini-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .mini-overlay.hidden{display:none;}
  .mini-dialog{
    background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:340px;
  }
  .mini-title{font-size:16.5px;font-weight:700;margin-bottom:10px;text-align:right;}
  .mini-sub{font-size:13px;color:var(--text-dim);margin-bottom:12px;line-height:1.6;text-align:right;}
  .mini-input{
    width:100%;font-family:inherit;font-size:15px;color:var(--text);
    border:1px solid var(--divider);border-radius:8px;padding:11px 14px;outline:none;
    text-align:right;margin-bottom:16px;
  }
  .mini-input:focus{border-color:var(--blue);}
  .mini-actions{display:flex;justify-content:flex-end;gap:8px;}
  .mini-btn{
    font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:8px;
    padding:10px 16px;cursor:pointer;
  }
  .mini-btn.ghost{background:transparent;color:var(--text-dim);}
  .mini-btn.ghost:active{background:var(--divider);}
  .mini-btn.primary{background:var(--blue);color:#fff;}
  .mini-btn.primary:active{background:#1558b0;}
  .mini-btn.danger{background:var(--danger-soft);color:var(--danger);}
  .mini-btn.danger:active{background:#f6c6c1;}

  /* ---------- undo toast ---------- */
  .undo-toast{
    position:fixed;bottom:20px;left:16px;right:16px;max-width:420px;margin:0 auto;
    background:#323232;color:#fff;border-radius:10px;padding:13px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    z-index:90;overflow:hidden;
  }
  .undo-toast.hidden{display:none;}
  .undo-toast span{font-size:13.5px;flex:1;}
  .undo-toast button{
    background:transparent;border:none;color:#8ab4f8;font-family:inherit;font-size:13.5px;font-weight:700;
    cursor:pointer;flex-shrink:0;
  }
  .undo-bar{
    position:absolute;bottom:0;right:0;left:0;height:2.5px;background:#8ab4f8;
    transform-origin:right;animation:undoShrink linear forwards;
  }
  @keyframes undoShrink{ from{transform:scaleX(1);} to{transform:scaleX(0);} }
</style>
</head>

let saveTimer = null;

function uid(){ return 'i' + Math.random().toString(36).slice(2,10); }
function makeTask(text){ return {id:uid(), text, done:false, starred:false, cost:null, subtasks:[]}; }
function makeSub(text){ return {id:uid(), text, done:false, starred:false, cost:null}; }
function makeProject(name){ return {id:uid(), name, tasks:[], completedOpen:false}; }

function seedData(){
  const zeitoun = makeProject('پروژه زیتون');
  const bargh = makeTask('برق کشی');
  bargh.subtasks.push(makeSub('هماهنگی با صابر'));
  const loole = makeTask('لوله کشی تاسیسات');
  loole.subtasks.push(makeSub('هماهنگی با فیروز پور'));
  zeitoun.tasks.push(bargh, loole);

  const ghamshe = makeProject('پروژه قمشه');
  const kandan = makeTask('کندن کف محوطه');
  kandan.subtasks.push(makeSub('هماهنگ کردن بیل مکانیکی'));
  ghamshe.tasks.push(kandan);

  return { projects:[zeitoun, ghamshe], viewMode:'simple', activeTab: zeitoun.id };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ data = JSON.parse(raw); return; }
  }catch(e){}
  data = seedData();
  persist();
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ showToast('ذخیره‌سازی با خطا مواجه شد'); }
    cloudSyncActiveProject();
  }, 120);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function findProject(pid){ return data.projects.find(p=>p.id===pid); }
function findTask(pid, tid){ const p = findProject(pid); return p ? p.tasks.find(t=>t.id===tid) : null; }
function findSub(pid, tid, sid){ const t = findTask(pid, tid); return t ? t.subtasks.find(s=>s.id===sid) : null; }

function toPersianDigits(str){ return String(str).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function toEnglishDigits(str){ return String(str).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function formatCost(n){ if(n===null || n===undefined || n==='' || isNaN(n)) return toPersianDigits('0'); return toPersianDigits(Math.round(n).toLocaleString('en-US')); }
function taskCostSum(task){
  let total = parseFloat(task.cost)||0;
  task.subtasks.forEach(s => total += (parseFloat(s.cost)||0));
  return total;
}
function projectCostSum(project){
  return project.tasks.reduce((sum,t)=> sum + taskCostSum(t), 0);
}

function toggleTaskDone(pid, tid){
  const t = findTask(pid, tid);
  t.done = !t.done;
  t.subtasks.forEach(s => s.done = t.done);
  persist(); renderAll();
}
function toggleSubDone(pid, tid, sid){
  const s = findSub(pid, tid, sid);
  s.done = !s.done;
  persist(); renderAll();
}
function toggleTaskStar(pid, tid){ const t = findTask(pid,tid); t.starred = !t.starred; persist(); renderAll(); }
function toggleSubStar(pid, tid, sid){ const s = findSub(pid,tid,sid); s.starred = !s.starred; persist(); renderAll(); }

function deleteTask(pid, tid){
  closeSheet();
  softDelete('task', pid, tid, null, 'کار حذف شد');
}
function deleteSub(pid, tid, sid){
  softDelete('sub', pid, tid, sid, 'زیرمجموعه حذف شد');
}
function addTaskToProject(pid, text){
  if(!text || !text.trim()) return;
  const p = findProject(pid);
  p.tasks.push(makeTask(text.trim()));
  persist(); renderAll();
}
function addSubToTask(pid, tid, text){
  if(!text || !text.trim()) return;
  const t = findTask(pid, tid);
  t.subtasks.push(makeSub(text.trim()));
  persist(); renderAll(); if(currentDetail) openTaskDetail(pid, tid);
}
function addProject(name){
  if(!name || !name.trim()) return;
  const p = makeProject(name.trim());
  if(cloudMode && currentUser){
    const ref = db.collection('projects').doc();
    p.id = ref.id;
    p.ownerUid = currentUser.uid;
    p.sharedWith = [];
    ref.set({ name:p.name, tasks:p.tasks, completedOpen:false, ownerUid:currentUser.uid, sharedWith:[] }).catch(()=> showToast('خطا در ساخت پروژه روی سرور'));
  }
  data.projects.push(p);
  data.activeTab = p.id;
  persist(); renderAll();
}
function deleteProject(pid){
  softDelete('project', pid, null, null, 'پروژه حذف شد');
}

/* ---------- cloud sync (Firebase) ---------- */
let cloudMode = false;
let currentUser = null;
let cloudUnsubOwned = null, cloudUnsubShared = null;
let migratedGuestData = false;

function cloudSyncActiveProject(){
  if(!cloudMode || !currentUser) return;
  const p = findProject(data.activeTab);
  if(!p || !p.ownerUid) return;
  db.collection('projects').doc(p.id).set({
    name: p.name,
    tasks: p.tasks,
    completedOpen: !!p.completedOpen,
    ownerUid: p.ownerUid,
    sharedWith: p.sharedWith || []
  }, { merge:true }).catch(()=> showToast('خطا در همگام‌سازی با سرور'));
}

function cloudDeleteProject(p){
  if(!cloudMode || !p || !p.ownerUid) return;
  db.collection('projects').doc(p.id).delete().catch(()=>{});
}

function cloudRenameProject(p){
  if(!cloudMode || !p || !p.ownerUid) return;
  db.collection('projects').doc(p.id).update({ name: p.name }).catch(()=>{});
}

function docToProject(doc){
  const d = doc.data();
  return {
    id: doc.id,
    name: d.name,
    tasks: d.tasks || [],
    completedOpen: !!d.completedOpen,
    ownerUid: d.ownerUid,
    sharedWith: d.sharedWith || [],
    expanded: true
  };
}

function mergeCloudSnapshots(ownedDocs, sharedDocs){
  const map = {};
  ownedDocs.forEach(doc => map[doc.id] = docToProject(doc));
  sharedDocs.forEach(doc => { if(!map[doc.id]) map[doc.id] = docToProject(doc); });
  const preservedActive = data ? data.activeTab : null;
  const preservedMode = data ? data.viewMode : 'simple';
  data = { projects: Object.values(map), viewMode: preservedMode, activeTab: preservedActive };
  if(!data.projects.find(p=>p.id===data.activeTab)){
    data.activeTab = data.projects.length ? data.projects[0].id : 'starred';
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  renderAll();
}

function startCloudListeners(){
  stopCloudListeners();
  let ownedDocs = [], sharedDocs = [];
  cloudUnsubOwned = db.collection('projects').where('ownerUid','==',currentUser.uid)
    .onSnapshot(snap => { ownedDocs = snap.docs; mergeCloudSnapshots(ownedDocs, sharedDocs); },
      ()=> showToast('خطا در دریافت اطلاعات از سرور'));
  cloudUnsubShared = db.collection('projects').where('sharedWith','array-contains', currentUser.email)
    .onSnapshot(snap => { sharedDocs = snap.docs; mergeCloudSnapshots(ownedDocs, sharedDocs); },
      ()=> showToast('خطا در دریافت اطلاعات از سرور'));
}
function stopCloudListeners(){
  if(cloudUnsubOwned) cloudUnsubOwned();
  if(cloudUnsubShared) cloudUnsubShared();
  cloudUnsubOwned = null; cloudUnsubShared = null;
}

async function migrateGuestDataToCloud(){
  if(migratedGuestData) return;
  migratedGuestData = true;
  const guestProjects = (data && data.projects) ? data.projects.filter(p=>!p.ownerUid) : [];
  for(const p of guestProjects){
    const ref = db.collection('projects').doc();
    await ref.set({
      name: p.name, tasks: p.tasks, completedOpen: !!p.completedOpen,
      ownerUid: currentUser.uid, sharedWith: []
    }).catch(()=>{});
  }
}

/* ---------- soft delete / undo (like WhatsApp/Telegram) ---------- */
let pendingDelete = null;

function isPendingDeleted(type, pid, tid, sid){
  if(!pendingDelete || pendingDelete.pid !== pid) return false;
  if(pendingDelete.type === 'project') return true;
  if(pendingDelete.type === 'task') return pendingDelete.tid === tid;
  if(pendingDelete.type === 'sub') return type === 'sub' && pendingDelete.tid === tid && pendingDelete.sid === sid;
  return false;
}

function softDelete(type, pid, tid, sid, label){
  if(pendingDelete) finalizePendingDelete();
  pendingDelete = { type, pid, tid, sid };
  renderAll();
  if(currentDetail) renderSheet();
  showUndoToast(label);
  pendingDelete.timeoutId = setTimeout(finalizePendingDelete, 4000);
}

function finalizePendingDelete(){
  if(!pendingDelete) return;
  const { type, pid, tid, sid, timeoutId } = pendingDelete;
  clearTimeout(timeoutId);
  if(type === 'project'){
    const p = findProject(pid);
    if(p) cloudDeleteProject(p);
    data.projects = data.projects.filter(p => p.id !== pid);
    if(data.activeTab === pid) data.activeTab = data.projects.length ? data.projects[0].id : 'starred';
  } else if(type === 'task'){
    const p = findProject(pid);
    if(p) p.tasks = p.tasks.filter(t => t.id !== tid);
  } else if(type === 'sub'){
    const t = findTask(pid, tid);
    if(t) t.subtasks = t.subtasks.filter(s => s.id !== sid);
  }
  pendingDelete = null;
  persist(); renderAll();
  hideUndoToast();
}

function undoPendingDelete(){
  if(!pendingDelete) return;
  clearTimeout(pendingDelete.timeoutId);
  pendingDelete = null;
  renderAll();
  if(currentDetail) renderSheet();
  hideUndoToast();
}

function showUndoToast(label){
  const t = document.getElementById('undoToast');
  document.getElementById('undoToastText').textContent = label;
  const bar = document.getElementById('undoToastBar');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = 'undoShrink 4s linear forwards';
  t.classList.remove('hidden');
}
function hideUndoToast(){
  document.getElementById('undoToast').classList.add('hidden');
}
document.getElementById('undoToastBtn').onclick = undoPendingDelete;

/* ---------- collect starred ---------- */
function collectStarred(){
  const out = [];
  data.projects.forEach(p=>{
    if(isPendingDeleted('project', p.id)) return;
    p.tasks.forEach(t=>{
      if(isPendingDeleted('task', p.id, t.id)) return;
      if(t.starred) out.push({pid:p.id, tid:t.id, sid:null, text:t.text, done:t.done, cost:t.cost, projectName:p.name});
      t.subtasks.forEach(s=>{
        if(isPendingDeleted('sub', p.id, t.id, s.id)) return;
        if(s.starred) out.push({pid:p.id, tid:t.id, sid:s.id, text:s.text, done:s.done, cost:s.cost, projectName:p.name});
      });
    });
  });
  return out;
}

/* ---------- tab bar ---------- */
function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';

  const starTab = document.createElement('div');
  starTab.className = 'tab star-tab' + (data.activeTab==='starred' ? ' active' : '');
  starTab.innerHTML = svgStar(true);
  starTab.onclick = ()=>{ data.activeTab = 'starred'; addItemActive = false; persist(); renderAll(); };
  bar.appendChild(starTab);

  data.projects.forEach(p=>{
    if(isPendingDeleted('project', p.id)) return;
    const undone = p.tasks.filter(t=>!t.done && !isPendingDeleted('task', p.id, t.id)).length;
    const tab = document.createElement('div');
    tab.className = 'tab' + (data.activeTab===p.id ? ' active' : '');
    tab.dataset.id = p.id;
    tab.innerHTML = '<span>'+escapeHtml(p.name)+'</span>' + (undone ? '<span class="count">'+undone+'</span>' : '');
    attachTabInteractions(tab, p);
    bar.appendChild(tab);
  });

  const addTab = document.createElement('div');
  addTab.className = 'tab add-tab';
  addTab.textContent = '+';
  addTab.onclick = ()=>{
    openMiniPrompt('نام پروژهٔ جدید', 'مثلاً «پروژه زیتون»', (name)=>{ if(name && name.trim()) addProject(name); });
  };
  bar.appendChild(addTab);

  if(data.activeTab !== 'starred'){
    const activeEl = bar.querySelector('.tab[data-id="'+data.activeTab+'"]');
    if(activeEl) activeEl.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
  }
}

function attachTabInteractions(tab, p){
  let pressTimer=null, startX=0, startY=0, moved=false, longPressFired=false, dragging=false;
  tab.onpointerdown = (e)=>{
    startX = e.clientX; startY = e.clientY; moved=false; longPressFired=false; dragging=false;
    pressTimer = setTimeout(()=>{
      longPressFired = true;
      openTabEditPopup(p);
    }, 550);
  };
  tab.onpointermove = (e)=>{
    if(dragging || longPressFired) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8){
      moved = true;
      clearTimeout(pressTimer);
      dragging = true;
      startTabDrag(e, p.id, tab);
    }
  };
  tab.onpointerup = ()=>{
    clearTimeout(pressTimer);
    if(!moved && !longPressFired){
      data.activeTab = p.id; addItemActive = false; persist(); renderAll();
    }
  };
  tab.onpointercancel = ()=> clearTimeout(pressTimer);
  tab.oncontextmenu = (e)=> e.preventDefault();
}

/* ---------- tab drag reorder (horizontal) ---------- */
let tabDragState = null;
function startTabDrag(e, id, tabEl){
  const bar = document.getElementById('tabbar');
  const siblingEls = Array.from(bar.children).filter(el => el.classList.contains('tab') && el.dataset.id);
  tabDragState = { id, siblingEls, hoverEl:null, hoverPos:null, tabEl };
  tabEl.style.opacity = '.4';
  document.addEventListener('pointermove', onTabDragMove);
  document.addEventListener('pointerup', onTabDragEnd, { once:true });
}
function onTabDragMove(e){
  if(!tabDragState) return;
  const x = e.clientX;
  const others = tabDragState.siblingEls.filter(el => el !== tabDragState.tabEl);
  let target=null, pos=null;
  for(const el of others){
    const rect = el.getBoundingClientRect();
    const mid = rect.left + rect.width/2;
    if(x > mid){ target = el; pos = 'after'; break; }
  }
  if(!target && others.length){ target = others[0]; pos = 'before'; }
  tabDragState.hoverEl = target;
  tabDragState.hoverPos = pos;
}
function onTabDragEnd(){
  if(!tabDragState) return;
  document.removeEventListener('pointermove', onTabDragMove);
  tabDragState.tabEl.style.opacity = '';
  const { id, hoverEl, hoverPos } = tabDragState;
  tabDragState = null;
  if(!hoverEl) return;
  const targetId = hoverEl.dataset.id;
  const fromIdx = data.projects.findIndex(p=>p.id===id);
  if(fromIdx===-1) return;
  const [moved] = data.projects.splice(fromIdx,1);
  let toIdx = data.projects.findIndex(p=>p.id===targetId);
  if(toIdx===-1){ data.projects.splice(fromIdx,0,moved); return; }
  if(hoverPos==='after') toIdx += 1;
  data.projects.splice(toIdx,0,moved);
  persist(); renderAll();
}

/* ---------- generic mini prompt dialog (replaces window.prompt) ---------- */
let miniPromptCallback = null;
function openMiniPrompt(title, placeholder, onConfirm){
  miniPromptCallback = onConfirm;
  document.getElementById('promptTitle').textContent = title;
  const input = document.getElementById('promptInput');
  input.value = '';
  input.placeholder = placeholder || '';
  document.getElementById('promptOverlay').classList.remove('hidden');
  setTimeout(()=> input.focus(), 0);
}
function closeMiniPrompt(){ document.getElementById('promptOverlay').classList.add('hidden'); }
document.getElementById('promptCancelBtn').onclick = closeMiniPrompt;
document.getElementById('promptConfirmBtn').onclick = ()=>{
  const val = document.getElementById('promptInput').value;
  closeMiniPrompt();
  if(miniPromptCallback) miniPromptCallback(val);
};
document.getElementById('promptInput').onkeydown = (e)=>{
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('promptConfirmBtn').click(); }
};
document.getElementById('promptOverlay').onclick = (e)=>{
  if(e.target.id==='promptOverlay') closeMiniPrompt();
};

/* ---------- content ---------- */
let currentDetail = null;
let addItemActive = false;

function renderAll(){
  renderTabs();
  renderModeToggle();
  const content = document.getElementById('content');
  content.innerHTML = '';
  if(data.activeTab === 'starred'){
    renderStarredView(content);
  } else {
    const p = findProject(data.activeTab);
    if(!p){ content.innerHTML = '<div class="empty-state">پروژه‌ای انتخاب نشده. از نوار بالا یکی را بسازید.</div>'; return; }
    renderProjectView(content, p);
  }
}

function renderModeToggle(){
  const btn = document.getElementById('modeToggle');
  const label = document.getElementById('modeToggleLabel');
  if(data.viewMode === 'cost'){ btn.classList.add('active'); label.textContent = 'نمایش ساده'; }
  else { btn.classList.remove('active'); label.textContent = 'نمایش هزینه'; }
}
document.getElementById('modeToggle').onclick = ()=>{
  data.viewMode = data.viewMode === 'cost' ? 'simple' : 'cost';
  persist(); renderAll();
};

function renderProjectView(content, p){
  if(data.viewMode === 'cost'){
    const summary = document.createElement('div');
    summary.className = 'cost-summary';
    summary.innerHTML = '<span>برآورد هزینهٔ کل پروژه</span><b>'+formatCost(projectCostSum(p))+'</b>';
    content.appendChild(summary);
  }

  const visibleTasks = p.tasks.filter(t => !isPendingDeleted('task', p.id, t.id));
  const active = visibleTasks.filter(t=>!t.done);
  const completed = visibleTasks.filter(t=>t.done);

  if(!active.length && !completed.length){
    content.appendChild(elFromHtml('<div class="empty-state">کاری در این پروژه نیست. با دکمهٔ + یکی اضافه کنید.</div>'));
  }

  active.forEach(t => content.appendChild(renderTaskBlock(p, t)));

  content.appendChild(renderInlineAddRow(p));

  if(completed.length){
    const header = document.createElement('div');
    header.className = 'completed-header';
    header.innerHTML = '<span>تکمیل‌شده ('+completed.length+')</span><span class="chev'+(p.completedOpen?'':' collapsed')+'">'+svgChevron()+'</span>';
    header.onclick = ()=>{ p.completedOpen = !p.completedOpen; persist(); renderAll(); };
    content.appendChild(header);

    const list = document.createElement('div');
    list.className = 'completed-list' + (p.completedOpen ? '' : ' hidden');
    completed.forEach(t => list.appendChild(renderTaskBlock(p, t)));
    content.appendChild(list);
  }
}

function renderInlineAddRow(p){
  const row = document.createElement('div');

  if(!addItemActive){
    row.className = 'inline-add-row';
    row.innerHTML = '<span class="plus-circle">'+svgPlus()+'</span><span>افزودن مورد</span>';
    row.onclick = ()=>{ addItemActive = true; renderAll(); focusInlineAdd(); };
    return row;
  }

  row.className = 'inline-add-row active';
  const check = document.createElement('span');
  check.className = 'empty-check';
  row.appendChild(check);

  const input = document.createElement('input');
  input.id = 'inlineAddInput';
  input.placeholder = 'مورد جدید…';

  const commit = ()=>{
    if(input.value.trim()){
      addTaskToProject(p.id, input.value);
      addItemActive = true;
      renderAll();
      focusInlineAdd();
    }
  };
  input.onkeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    if(e.key==='Escape'){ addItemActive = false; renderAll(); }
  };
  input.onblur = ()=>{
    setTimeout(()=>{
      if(document.activeElement && document.activeElement.id==='inlineAddInput') return;
      if(input.value.trim()) commit();
      else { addItemActive = false; renderAll(); }
    }, 120);
  };
  row.appendChild(input);

  const xBtn = document.createElement('button');
  xBtn.className = 'x-btn';
  xBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  xBtn.onclick = ()=>{ addItemActive = false; renderAll(); };
  row.appendChild(xBtn);

  return row;
}
function focusInlineAdd(){
  setTimeout(()=>{
    const el = document.getElementById('inlineAddInput');
    if(el) el.focus();
  }, 0);
}

function renderTaskBlock(p, t){
  const block = document.createElement('div');
  block.className = 'task-block';

  const row = document.createElement('div');
  row.className = 'row' + (t.done ? ' completed' : '');
  row.appendChild(buildCircle(t.done, (e)=>{ e.stopPropagation(); toggleTaskDone(p.id, t.id); }));
  const body = document.createElement('div');
  body.className = 'row-body';
  const title = document.createElement('div');
  title.className = 'row-title';
  title.textContent = t.text;
  body.appendChild(title);
  row.appendChild(body);
  if(data.viewMode === 'cost'){
    const c = document.createElement('span');
    c.className = 'row-cost';
    c.textContent = formatCost(taskCostSum(t));
    row.appendChild(c);
  }
  row.appendChild(buildStar(t.starred, (e)=>{ e.stopPropagation(); toggleTaskStar(p.id, t.id); }));
  row.onclick = ()=> openTaskDetail(p.id, t.id);
  block.appendChild(row);

  t.subtasks.filter(s => !isPendingDeleted('sub', p.id, t.id, s.id)).forEach(s=>{
    const srow = document.createElement('div');
    srow.className = 'row sub' + (s.done ? ' completed' : '');
    srow.appendChild(buildCircle(s.done, (e)=>{ e.stopPropagation(); toggleSubDone(p.id, t.id, s.id); }, true));
    const sbody = document.createElement('div');
    sbody.className = 'row-body';
    const stitle = document.createElement('div');
    stitle.className = 'row-title';
    stitle.textContent = s.text;
    sbody.appendChild(stitle);
    srow.appendChild(sbody);
    if(data.viewMode === 'cost' && s.cost){
      const c = document.createElement('span');
      c.className = 'row-cost';
      c.textContent = formatCost(s.cost);
      srow.appendChild(c);
    }
    srow.appendChild(buildStar(s.starred, (e)=>{ e.stopPropagation(); toggleSubStar(p.id, t.id, s.id); }));
    srow.onclick = ()=> openSubDetail(p.id, t.id, s.id);
    block.appendChild(srow);
  });

  return block;
}

function renderStarredView(content){
  const items = collectStarred();
  if(!items.length){
    content.appendChild(elFromHtml('<div class="empty-state">هنوز چیزی ستاره‌دار نشده. کنار هر کار روی ستاره بزنید.</div>'));
    return;
  }
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'row' + (item.done ? ' completed' : '');
    row.appendChild(buildCircle(item.done, (e)=>{
      e.stopPropagation();
      if(item.sid) toggleSubDone(item.pid, item.tid, item.sid);
      else toggleTaskDone(item.pid, item.tid);
    }));
    const body = document.createElement('div');
    body.className = 'row-body';
    const title = document.createElement('div');
    title.className = 'row-title';
    title.textContent = item.text;
    body.appendChild(title);
    const tag = document.createElement('span');
    tag.className = 'starred-tag';
    tag.textContent = item.projectName;
    body.appendChild(tag);
    row.appendChild(body);
    row.appendChild(buildStar(true, (e)=>{
      e.stopPropagation();
      if(item.sid) toggleSubStar(item.pid, item.tid, item.sid);
      else toggleTaskStar(item.pid, item.tid);
    }));
    row.onclick = ()=>{
      if(item.sid) openSubDetail(item.pid, item.tid, item.sid);
      else openTaskDetail(item.pid, item.tid);
    };
    content.appendChild(row);
  });
}

function buildCircle(checked, onClick, small){
  const c = document.createElement('span');
  c.className = 'circle' + (checked ? ' checked' : '');
  c.innerHTML = checked ? svgCheck() : '';
  c.onclick = onClick;
  return c;
}
function buildStar(starred, onClick){
  const s = document.createElement('span');
  s.className = 'star-icon' + (starred ? ' starred' : '');
  s.innerHTML = svgStar(starred);
  s.onclick = onClick;
  return s;
}
function elFromHtml(html){
  const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild;
}

/* ---------- detail sheet ---------- */

function openTaskDetail(pid, tid){
  currentDetail = {pid, tid, sid:null};
  renderSheet();
  document.getElementById('overlay').classList.remove('hidden');
}
function openSubDetail(pid, tid, sid){
  currentDetail = {pid, tid, sid};
  renderSheet();
  document.getElementById('overlay').classList.remove('hidden');
}
function closeSheet(){
  currentDetail = null;
  document.getElementById('overlay').classList.add('hidden');
  renderAll();
}
document.getElementById('closeSheetBtn').onclick = closeSheet;
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeSheet(); };

function renderSheet(){
  if(!currentDetail) return;
  const { pid, tid, sid } = currentDetail;
  const body = document.getElementById('sheetBody');
  body.innerHTML = '';

  const isSub = !!sid;
  const item = isSub ? findSub(pid, tid, sid) : findTask(pid, tid);
  if(!item){ closeSheet(); return; }

  const titleRow = document.createElement('div');
  titleRow.className = 'detail-title-row';
  titleRow.appendChild(buildCircle(item.done, ()=>{
    if(isSub) toggleSubDone(pid, tid, sid); else toggleTaskDone(pid, tid);
    if(currentDetail) renderSheet();
  }));
  const titleInput = document.createElement('textarea');
  titleInput.className = 'detail-title';
  titleInput.rows = 1;
  titleInput.value = item.text;
  titleInput.oninput = ()=>{ titleInput.style.height='auto'; titleInput.style.height = titleInput.scrollHeight+'px'; };
  titleInput.onblur = ()=>{
    item.text = titleInput.value.trim() || item.text;
    persist(); renderAll();
  };
  titleRow.appendChild(titleInput);
  body.appendChild(titleRow);

  const starRow = document.createElement('div');
  starRow.className = 'detail-star-row';
  const starIcon = buildStar(item.starred, (e)=>{
    e.stopPropagation();
    if(isSub) toggleSubStar(pid, tid, sid); else toggleTaskStar(pid, tid);
    if(currentDetail) renderSheet();
  });
  starRow.appendChild(starIcon);
  starRow.onclick = ()=>{
    if(isSub) toggleSubStar(pid, tid, sid); else toggleTaskStar(pid, tid);
    if(currentDetail) renderSheet();
  };
  body.appendChild(starRow);

  if(!isSub){
    const subField = document.createElement('div');
    subField.className = 'detail-field';
    subField.innerHTML = '<div class="detail-label">زیرمجموعه‌ها</div>';
    item.subtasks.filter(s => !isPendingDeleted('sub', pid, tid, s.id)).forEach(s=>{
      const row = document.createElement('div');
      row.className = 'sub-item';
      row.appendChild(buildCircle(s.done, ()=>{ toggleSubDone(pid, tid, s.id); if(currentDetail) renderSheet(); }, true));
      const input = document.createElement('input');
      input.className = 'sub-text';
      input.value = s.text;
      input.onblur = ()=>{ s.text = input.value.trim() || s.text; persist(); renderAll(); };
      row.appendChild(input);
      const del = document.createElement('button');
      del.className = 'sub-del';
      del.innerHTML = svgTrash();
      del.onclick = ()=> deleteSub(pid, tid, s.id);
      row.appendChild(del);
      subField.appendChild(row);
    });

    const addRow = document.createElement('div');
    addRow.className = 'add-sub-row';
    const addInput = document.createElement('input');
    addInput.className = 'sub-add-input';
    addInput.placeholder = 'افزودن زیرمجموعه…';
    const addBtn = document.createElement('button');
    addBtn.className = 'add-sub-btn';
    addBtn.innerHTML = svgPlus();
    const commitAdd = ()=>{
      if(addInput.value.trim()){
        addSubToTask(pid, tid, addInput.value);
      }
    };
    addBtn.onclick = commitAdd;
    addInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); commitAdd(); } };
    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    subField.appendChild(addRow);

    body.appendChild(subField);
  }

  const costField = document.createElement('div');
  costField.className = 'detail-field';
  costField.innerHTML = '<div class="detail-label">برآورد هزینه (تومان)</div>';
  const costInput = document.createElement('input');
  costInput.type = 'text';
  costInput.className = 'detail-cost-input';
  costInput.placeholder = '۰';
  costInput.inputMode = 'decimal';
  costInput.value = (item.cost===null || item.cost===undefined || item.cost==='') ? '' : formatCost(item.cost);
  costInput.oninput = ()=>{
    const rawDigits = toEnglishDigits(costInput.value).replace(/[^0-9]/g,'');
    item.cost = rawDigits === '' ? null : parseFloat(rawDigits);
    costInput.value = rawDigits === '' ? '' : toPersianDigits(parseInt(rawDigits,10).toLocaleString('en-US'));
    persist();
  };
  costInput.onblur = ()=>{
    costInput.value = (item.cost===null || item.cost===undefined) ? '' : formatCost(item.cost);
  };
  costField.appendChild(costInput);
  body.appendChild(costField);

  document.getElementById('deleteSheetBtn').onclick = ()=>{
    closeSheet();
    if(isSub) softDelete('sub', pid, tid, sid, 'زیرمجموعه حذف شد');
    else softDelete('task', pid, tid, null, 'کار حذف شد');
  };

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'confirm-btn';
  confirmBtn.textContent = 'تایید';
  confirmBtn.onclick = ()=>{
    item.text = titleInput.value.trim() || item.text;
    const rawDigits = toEnglishDigits(costInput.value).replace(/[^0-9]/g,'');
    item.cost = rawDigits === '' ? null : parseFloat(rawDigits);
    persist();
    closeSheet();
  };
  body.appendChild(confirmBtn);
}

/* ---------- side drawer (menu) ---------- */
function openDrawer(){ document.getElementById('drawerOverlay').classList.remove('hidden'); }
function closeDrawer(){ document.getElementById('drawerOverlay').classList.add('hidden'); }
document.getElementById('menuBtn').onclick = openDrawer;
document.getElementById('avatarBtn').onclick = openDrawer;
document.getElementById('drawerOverlay').onclick = (e)=>{ if(e.target.id==='drawerOverlay') closeDrawer(); };
document.getElementById('drawerSigninBtn').onclick = ()=>{
  if(currentUser){
    auth.signOut();
    closeDrawer();
  } else {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(()=>{
      auth.signInWithRedirect(provider);
    });
  }
};
document.getElementById('drawerCollabBtn').onclick = ()=>{
  closeDrawer();
  if(data.activeTab === 'starred' || !findProject(data.activeTab)){
    showToast('ابتدا یک پروژه را از نوار بالا انتخاب کنید');
    return;
  }
  if(!currentUser){
    showToast('برای اشتراک‌گذاری، ابتدا با گوگل وارد شوید');
    return;
  }
  const p = findProject(data.activeTab);
  if(p.ownerUid && p.ownerUid !== currentUser.uid){
    showToast('فقط سازندهٔ پروژه می‌تواند آن را به اشتراک بگذارد');
    return;
  }
  openShareDialog(data.activeTab);
};

/* ---------- share / collaborate dialog ---------- */
let shareTargetProjectId = null;
function openShareDialog(pid){
  shareTargetProjectId = pid;
  const p = findProject(pid);
  document.getElementById('shareDialogTitle').textContent = 'اشتراک‌گذاری «' + (p ? p.name : '') + '»';
  document.getElementById('shareEmailInput').value = '';
  document.getElementById('shareOverlay').classList.remove('hidden');
  setTimeout(()=> document.getElementById('shareEmailInput').focus(), 0);
}
function closeShareDialog(){ document.getElementById('shareOverlay').classList.add('hidden'); }
document.getElementById('shareCancelBtn').onclick = closeShareDialog;
document.getElementById('shareOverlay').onclick = (e)=>{ if(e.target.id==='shareOverlay') closeShareDialog(); };
document.getElementById('shareConfirmBtn').onclick = ()=>{
  const email = document.getElementById('shareEmailInput').value.trim().toLowerCase();
  const isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!isValidEmail){ showToast('یک آدرس جیمیل معتبر وارد کنید'); return; }
  const p = findProject(shareTargetProjectId);
  closeShareDialog();
  if(!p || !p.ownerUid){ showToast('این پروژه هنوز روی سرور نیست'); return; }
  db.collection('projects').doc(p.id).update({
    sharedWith: firebase.firestore.FieldValue.arrayUnion(email)
  }).then(()=>{
    showToast('دسترسی برای ' + email + ' اضافه شد');
  }).catch(()=> showToast('خطا در افزودن دسترسی'));
};

/* ---------- PWA service worker registration ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------- init ---------- */
loadData();
if(data.activeTab !== 'starred' && !findProject(data.activeTab)){
  data.activeTab = data.projects.length ? data.projects[0].id : 'starred';
}
renderAll();
</script>
